 rpx_industrial.1.t: "Economic Fluctuations"
 rpx_industrial.1.desc: "The economy continues to ebb and flow. Our industrial output is drifting with the changing conditions of the market, and our economists report a new shift in productive capacity."
 rpx_industrial.1.a: "Let the markets do their work"
 faction_alignment.1.t: "Under Threat - Seek Protection"
 faction_alignment.1.d: "Rumours of hostile intent grow louder along our borders. With rival nations mobilising and our own forces overstretched, the option of seeking protection from a like-minded great power is being debated in the halls of government."
 faction_alignment.1.a: "Seek their protection"
 faction_alignment.1.b: "We stand alone"
 faction_alignment.2.t: "Request to Join Faction"
 faction_alignment.2.d: "Our diplomats have been summoned before the faction's leadership. They will weigh our value against the risks of bringing us into the fold, and their answer will shape our place in the world."
 faction_alignment.2.a: "Accept them"
 faction_alignment.2.b: "Decline"
 faction_alignment.3.t: "Accepted into Faction"
 faction_alignment.3.d: "Our flag now flies alongside our allies. The guarantees of collective defence bring a measure of security, and the government moves to reassure a relieved public."
 faction_alignment.3.a: "A new chapter"
 faction_alignment.4.t: "Rejected from Faction"
 faction_alignment.4.d: "Our request has been refused. The leadership sees little to gain from our membership, and the snub is a bitter reminder of our standing in the world."
 faction_alignment.4.a: "We will remember this"
 faction_alignment.5.t: "Expansionist Ambitions - Fascist"
 faction_alignment.5.d: "Party rallies echo with calls for a greater realm. Our ideological allies abroad share our vision, and an alliance of conviction could carry our ambitions across the border."
 faction_alignment.5.a: "Join forces with our ideological allies"
 faction_alignment.5.b: "We forge our own path"
 faction_alignment.6.t: "Expansionist Request - Fascist"
 faction_alignment.6.d: "A fellow fascist power has approached us, offering to throw in its lot with our cause. Their resolve will be tested against our standards before we decide."
 faction_alignment.6.a: "Welcome them"
 faction_alignment.6.b: "They are not worthy"
 faction_alignment.7.t: "Expansionist Ambitions - Communist"
 faction_alignment.7.d: "The international workers' movement calls to our comrades abroad. A pact among revolutionaries could spread the flame of revolution far beyond our own borders."
 faction_alignment.7.a: "Unite with our comrades"
 faction_alignment.7.b: "We pursue our own revolution"
 faction_alignment.8.t: "Expansionist Request - Communist"
 faction_alignment.8.d: "A fellow revolutionary state has come forward, eager to stand alongside the proletariat. We must judge whether they measure up to the cause."
 faction_alignment.8.a: "Accept them into the fold"
 faction_alignment.8.b: "They do not meet our standards"
 ideological_tension_v2.1.t: "Ideological Tensions with Neighbor - Faction Aware"
 ideological_tension_v2.1.d: "Tensions with our neighbours have grown sharp. Their ideology is hostile to our own, and with the balance of power in our favour, we may press our demands - or prepare for war."
 ideological_tension_v2.1.a: "Demand they change their ways"
 ideological_tension_v2.1.b: "Ignore for now"
 ideological_tension_v2.2.t: "Opportunity Against Weak Neighbor - Faction Aware"
 ideological_tension_v2.2.d: "One of our neighbours is weak and isolated, ripe for conquest. The moment is opportune to strike while they are at their lowest."
 ideological_tension_v2.2.a: "Strike while they are weak"
 ideological_tension_v2.2.b: "We should not act rashly"
 ideological_tension_v2.3.t: "Great Power Aggression - Fascist/Communist - Faction Aware"
 ideological_tension_v2.3.d: "Our faction stands among the great powers, and a rival power of hostile ideology beckons. To challenge their might would reshape the world order."
 ideological_tension_v2.3.a: "Challenge their power"
 ideological_tension_v2.3.b: "Not the right time"
 ideological_tension_v2.4.t: "Great Power Intervention - Democratic - Faction Aware"
 ideological_tension_v2.4.d: "A totalitarian great power is at war, and its victory would menace the free world. The moment may call for us to intervene against tyranny."
 ideological_tension_v2.4.a: "Intervene against tyranny"
 ideological_tension_v2.4.b: "We must remain neutral"
 ideological_tension_v2.5.t: "Great Power Intervention - Neutrality - Faction Aware"
 ideological_tension_v2.5.d: "A totalitarian great power wages war abroad, threatening the balance of the world. Our neutrality is a shield, but it may not hold forever."
 ideological_tension_v2.5.a: "We cannot stand idle"
 ideological_tension_v2.5.b: "This is not our fight"
 generic_war.1.t: "Call to Arms - Join Faction's War"
 generic_war.1.d: "Our faction leader has drawn the sword and calls upon us to stand beside them. The banners of our allies are unfurled, and the drums of war echo across the continent."
 generic_war.1.a: "Answer the call to arms"
 generic_war.1.b: "Refuse to participate"
 generic_war.2.t: "Faction Member Requests Support"
 generic_war.2.d: "We are at war, but not all of our allies stand with us. Some among the faction have yet to join the fight, and their help could tip the balance in our favour."
 generic_war.2.a: "Request assistance"
 generic_war.2.b: "We fight alone for now"
 generic_war.3.t: "Ally Requests Our Support in War"
 generic_war.3.d: "A fellow member of our faction has asked us to take up arms in their war. Their enemy is our enemy, but our own strength must be weighed before we commit."
 generic_war.3.a: "Join their war"
 generic_war.3.b: "Decline to help"
 generic_war.4.t: "Ally Agrees to Join"
 generic_war.4.d: "Our ally has answered our call. Their armies march beside ours, and the bonds of the faction are strengthened by their loyalty."
 generic_war.4.a: "A friend in need"
 generic_war.5.t: "Ally Refuses to Join"
 generic_war.5.d: "Our ally has declined to stand with us in this war. The slight stings, and we must fight on without their banners."
 generic_war.5.a: "We will carry on"
 generic_war.6.t: "Ideological Expansion Opportunity"
 generic_war.6.d: "Our faction holds the advantage, and a weaker, ideologically hostile state lies within reach. The opportunity to expand our influence - and our borders - presents itself."
 generic_war.6.a: "Seize the opportunity"
 generic_war.6.b: "Bide our time"
 generic_war.7.t: "Leader Justifies War Against [ideological_target.GetNameDef]"
 generic_war.7.d: "The faction leadership lays out its justification for war, rallying the faithful behind the coming conflict."
 generic_war.7.a: "We march"
 generic_war.8.t: "Democratic Containment War"
 generic_war.8.d: "The free world faces a rising tide of tyranny. To halt its advance, we must consider carrying the fight to those who would extinguish democracy."
 generic_war.8.a: "Contain the hostile ideology"
 generic_war.8.b: "Focus on domestic affairs"
 generic_war.9.t: "Faction Leader Announces Containment War"
 generic_war.9.d: "The faction leader proclaims the containment war to the world, framing the coming struggle as a defence of liberty."
 generic_war.9.a: "For liberty"
 generic_war.10.t: "Faction War - Rival Faction"
 generic_war.10.d: "A rival faction has risen to challenge our own. With the great powers girding for conflict, the road to supremacy runs through them."
 generic_war.10.a: "Declare war on the rival faction"
 generic_war.10.b: "Hold off for now"