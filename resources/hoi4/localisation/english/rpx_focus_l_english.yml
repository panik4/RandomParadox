 rpx_air1_air_force_command:0 "Air Force Command"
 rpx_air1_air_force_command_desc:0 "The air force is a new and revolutionary weapon of war. We will establish a dedicated command to organize, train and lead our airmen into battle."
 rpx_air1_fighter_program:0 "Fighter Program"
 rpx_air1_fighter_program_desc:0 "Control of the skies begins with the fighter. We will develop a new generation of fighter aircraft to win air superiority over our enemies."
 rpx_air1_interceptor_development:0 "Interceptor Development"
 rpx_air1_interceptor_development_desc:0 "Fast, agile interceptors are the best defense against enemy bombers. We will develop aircraft optimized to meet and destroy incoming raids."
 rpx_air1_fighter_engines:0 "Fighter Engines"
 rpx_air1_fighter_engines_desc:0 "Power is nothing without a reliable engine. We will invest in the high-performance engines that give our fighters speed and altitude."
 rpx_air1_air_superiority:0 "Air Superiority"
 rpx_air1_air_superiority_desc:0 "He who commands the air commands the battlefield. We will pursue a doctrine of aggressive air superiority to deny the skies to the enemy."
 rpx_air1_heavy_fighter:0 "Heavy Fighters"
 rpx_air1_heavy_fighter_desc:0 "Long range and heavy firepower make the heavy fighter a deadly escort. We will develop twin-engine fighters capable of ranging deep into enemy territory."
 rpx_air1_air_dominance:0 "Air Dominance"
 rpx_air1_air_dominance_desc:0 "Mere superiority is not enough; we must achieve absolute dominance over the enemy air force. Every hostile aircraft must be swept from the sky."
 rpx_air1_fighter_squadrons:0 "Fighter Squadrons"
 rpx_air1_fighter_squadrons_desc:0 "Wings and squadrons must be formed to bring our fighters to bear. We will raise and equip the squadrons needed to control the air."
 rpx_air1_ace_wing:0 "Ace Wing"
 rpx_air1_ace_wing_desc:0 "A handful of exceptional pilots can decide an air campaign. We will cultivate our aces and concentrate them into elite wings."
 rpx_air1_fighter_capstone:0 "Fighter Doctrine"
 rpx_air1_fighter_capstone_desc:0 "Our fighter force has reached its full maturity. We will codify its hard-won experience into a definitive doctrine for aerial combat."
 rpx_air1_home_defence:0 "Home Defense"
 rpx_air1_home_defence_desc:0 "The nation's factories and cities must be protected from the bomber's reach. We will build a dedicated home defense air force."
 rpx_air1_interception_net:0 "Interception Network"
 rpx_air1_interception_net_desc:0 "A raid reported in time is a raid half-defeated. We will build a coordinated network of radar stations and fighter bases to intercept hostile bombers."
 rpx_air1_early_warning:0 "Early Warning"
 rpx_air1_early_warning_desc:0 "Minutes of warning can save a city. We will establish an early warning system to give our defenders time to scramble."
 rpx_air1_escort_doctrine:0 "Escort Doctrine"
 rpx_air1_escort_doctrine_desc:0 "Our bombers must be escorted by fighters that can protect them all the way to the target. We will develop the tactics of long-range escort."
 rpx_air1_escort_squadrons:0 "Escort Squadrons"
 rpx_air1_escort_squadrons_desc:0 "Dedicated escort squadrons will shield our bomber streams from enemy fighters throughout their missions."
 rpx_air1_long_range_escort:0 "Long-Range Escort"
 rpx_air1_long_range_escort_desc:0 "To escort our bombers into the heart of enemy territory, our fighters must fly farther than ever before. We will expand their reach with external tanks and careful planning."
 rpx_air1_escort_command:0 "Escort Command"
 rpx_air1_escort_command_desc:0 "A dedicated command will coordinate escort operations and integrate fighter and bomber forces into a single striking arm."
 rpx_air1_doctrine_research:0 "Air Doctrine Research"
 rpx_air1_doctrine_research_desc:0 "Victory in the air belongs to those who study it. We will fund research into the operational doctrines of aerial warfare."
 rpx_air1_ace_training:0 "Ace Training"
 rpx_air1_ace_training_desc:0 "Great pilots are made, not born. We will expand our training to produce the aces who can tip the balance in the air."
 rpx_air1_combat_training:0 "Combat Training"
 rpx_air1_combat_training_desc:0 "The dogfight is won by the pilot who reacts first. We will train our airmen in the tactics of close combat flying."
 rpx_air1_pilot_training:0 "Pilot Training"
 rpx_air1_pilot_training_desc:0 "A modern air force needs thousands of trained pilots. We will build a comprehensive training program to keep our squadrons crewed."
 rpx_air1_officer_corps:0 "Air Officer Corps"
 rpx_air1_officer_corps_desc:0 "Officers provide the leadership that wins air campaigns. We will train a professional cadre of air commanders."
 rpx_air1_command_structure:0 "Air Command Structure"
 rpx_air1_command_structure_desc:0 "Clear chains of command and effective staff work make an air force formidable. We will reorganize our command structure for efficiency."
 rpx_air1_master_pilots:0 "Master Pilots"
 rpx_air1_master_pilots_desc:0 "The finest airmen in the world fly for our colors. We will raise an elite cadre of master pilots to lead our squadrons."
 rpx_air1_base_expansion:0 "Air Base Expansion"
 rpx_air1_base_expansion_desc:0 "Our airfields must be expanded to handle more aircraft and larger formations. We will invest in our base infrastructure."
 rpx_air1_fuel_reserves:0 "Fuel Reserves"
 rpx_air1_fuel_reserves_desc:0 "An air force without fuel is a grounded air force. We will build up reserves of aviation fuel for sustained operations."
 rpx_air1_maintenance:0 "Aircraft Maintenance"
 rpx_air1_maintenance_desc:0 "A well-maintained aircraft is a serviceable aircraft. We will improve our maintenance facilities to keep more planes in the air."
 rpx_air1_all_weather:0 "All-Weather Operations"
 rpx_air1_all_weather_desc:0 "The weather must never ground our air force. We will develop the instruments and training to fly in all conditions."
 rpx_air1_airfield_network:0 "Airfield Network"
 rpx_air1_airfield_network_desc:0 "A dispersed network of airfields makes our air force resilient and flexible. We will construct airfields across the nation."
 rpx_air1_volunteer_squadrons:0 "Volunteer Squadrons"
 rpx_air1_volunteer_squadrons_desc:0 "The skies of friendly nations can be defended by our volunteers. We will raise squadrons ready to fly wherever our cause requires."
 rpx_air1_supreme_air_power:0 "Supreme Air Power"
 rpx_air1_supreme_air_power_desc:0 "The mastery of the air is the mastery of the war. We will build an air force without equal, ready to decide the fate of nations from the skies."
 rpx_air2_air_force_command:0 "Air Force Command"
 rpx_air2_air_force_command_desc:0 "The air force is the hammer of the modern army. We will establish a dedicated command to organize, train and lead our airmen into battle."
 rpx_air2_cas_program:0 "Close Air Support Program"
 rpx_air2_cas_program_desc:0 "The aircraft that fights alongside the soldier decides the battle. We will build an air arm dedicated to supporting our ground forces."
 rpx_air2_close_air_support:0 "Close Air Support"
 rpx_air2_close_air_support_desc:0 "Our aircraft will strike directly at the enemy facing our troops. We will develop the tactics of close air support to break up hostile attacks."
 rpx_air2_ground_support:0 "Ground Support"
 rpx_air2_ground_support_desc:0 "Air power can be the reserve that turns a battle. We will train our airmen to support the advance of our armies."
 rpx_air2_armored_strikes:0 "Armored Strikes"
 rpx_air2_armored_strikes_desc:0 "Aircraft armed against armor are the death of the tank. We will develop weapons and tactics to destroy enemy armor from the air."
 rpx_air2_ground_attack:0 "Ground Attack"
 rpx_air2_ground_attack_desc:0 "Relentless attacks from the air break enemy morale and supply. We will build a powerful ground attack force."
 rpx_air2_dive_bombing:0 "Dive Bombing"
 rpx_air2_dive_bombing_desc:0 "The dive bomber places its bombs where they count. We will develop dive bombing as a precision instrument of the ground attack."
 rpx_air2_cas_squadrons:0 "CAS Squadrons"
 rpx_air2_cas_squadrons_desc:0 "Squadrons dedicated to close support will follow our armies in the field. We will raise and equip them for the coming campaigns."
 rpx_air2_cas_capstone:0 "Ground Attack Doctrine"
 rpx_air2_cas_capstone_desc:0 "The experience of our ground attack arm has been earned in blood. We will codify it into a definitive doctrine of tactical air power."
 rpx_air2_tactical_bombers:0 "Tactical Bombers"
 rpx_air2_tactical_bombers_desc:0 "The tactical bomber strikes behind the lines where it hurts most. We will develop aircraft that can hit enemy depots, railways and columns."
 rpx_air2_tac_range:0 "Tactical Bomber Range"
 rpx_air2_tac_range_desc:0 "Our bombers must reach deep into the enemy's rear. We will extend the range of our tactical bomber force."
 rpx_air2_tac_precision:0 "Precision Bombing"
 rpx_air2_tac_precision_desc:0 "Bombing with precision destroys the target and spares what must be spared. We will refine the techniques of accurate bombing."
 rpx_air2_tac_squadrons:0 "Tactical Bomber Squadrons"
 rpx_air2_tac_squadrons_desc:0 "A strong force of tactical bomber squadrons can cripple the enemy's ability to fight. We will raise them in numbers."
 rpx_air2_deep_strike:0 "Deep Strike"
 rpx_air2_deep_strike_desc:0 "The most telling blows land far behind the front. We will build a force capable of deep strikes against the enemy's war economy."
 rpx_air2_doctrine_research:0 "Air Doctrine Research"
 rpx_air2_doctrine_research_desc:0 "Tactical air power is a science as well as an art. We will fund research into the doctrine of air support for ground operations."
 rpx_air2_ground_coordination:0 "Ground Coordination"
 rpx_air2_ground_coordination_desc:0 "Air power and ground power must work as one. We will build the liaison structures to coordinate aircraft with the army."
 rpx_air2_fire_control:0 "Fire Control"
 rpx_air2_fire_control_desc:0 "Accurate fire requires good control. We will improve the direction and control of our air attacks in support of the ground battle."
 rpx_air2_ground_coord2:0 "Joint Operations"
 rpx_air2_ground_coord2_desc:0 "Full integration of air and ground forces multiplies their power. We will pursue true joint operations between army and air force."
 rpx_air2_training:0 "Crew Training"
 rpx_air2_training_desc:0 "The men who fly and fight our aircraft must be the best we can produce. We will expand and improve aircrew training."
 rpx_air2_base_expansion:0 "Air Base Expansion"
 rpx_air2_base_expansion_desc:0 "Our forward airfields must be expanded to support operations near the front. We will invest in our base infrastructure."
 rpx_air2_field_airfields:0 "Field Airfields"
 rpx_air2_field_airfields_desc:0 "Improvised airfields close to the front keep our aircraft flying in support of the army. We will develop mobile and field air operations."
 rpx_air2_maintenance:0 "Aircraft Maintenance"
 rpx_air2_maintenance_desc:0 "A well-maintained aircraft is a serviceable aircraft. We will improve our maintenance facilities to keep more planes in the air."
 rpx_air2_fuel:0 "Fuel Reserves"
 rpx_air2_fuel_desc:0 "An air force without fuel is a grounded air force. We will build up reserves of aviation fuel for sustained operations."
 rpx_air2_veteran_wings:0 "Veteran Wings"
 rpx_air2_veteran_wings_desc:0 "Seasoned wings fly where others cannot. We will preserve and concentrate the veteran aircrews of our ground attack arm."
 rpx_air2_ace_training:0 "Ace Training"
 rpx_air2_ace_training_desc:0 "Great pilots are made, not born. We will expand our training to produce the aces who can tip the balance in the air."
 rpx_air2_master_pilots:0 "Master Pilots"
 rpx_air2_master_pilots_desc:0 "The finest airmen in the world fly for our colors. We will raise an elite cadre of master pilots to lead our squadrons."
 rpx_air2_supreme_air_power:0 "Supreme Air Power"
 rpx_air2_supreme_air_power_desc:0 "The mastery of the air is the mastery of the war. We will build an air force without equal, ready to decide the fate of nations from the skies."
 rpx_air3_air_force_command:0 "Air Force Command"
 rpx_air3_air_force_command_desc:0 "The air force is a new and decisive arm of war. We will establish a dedicated command to organize, train and lead our airmen into battle."
 rpx_air3_strategic_bombing:0 "Strategic Bombing"
 rpx_air3_strategic_bombing_desc:0 "The bomber can strike at the enemy's war industry far behind the front. We will develop the capability for strategic bombing on a massive scale."
 rpx_air3_heavy_bombers:0 "Heavy Bombers"
 rpx_air3_heavy_bombers_desc:0 "Heavy bombers can carry the war to the enemy's heart. We will develop long-range four-engine bombers capable of devastating blows."
 rpx_air3_strat_range:0 "Bomber Range"
 rpx_air3_strat_range_desc:0 "The range of our bombers will decide which targets we can reach. We will expand the reach of our strategic bombing force."
 rpx_air3_strat_bombs:0 "Bomber Armament"
 rpx_air3_strat_bombs_desc:0 "The bomb is the bomber's argument. We will develop more powerful and effective bombs for our strategic aircraft."
 rpx_air3_strat_squadrons:0 "Strategic Bomber Squadrons"
 rpx_air3_strat_squadrons_desc:0 "A thousand bombers in the sky can end a war. We will raise the heavy bomber squadrons of our strategic force."
 rpx_air3_strat_capstone:0 "Strategic Bombing Doctrine"
 rpx_air3_strat_capstone_desc:0 "Our bombers have proved their worth. We will codify the experience of the strategic campaign into a definitive bombing doctrine."
 rpx_air3_naval_strike:0 "Naval Strike"
 rpx_air3_naval_strike_desc:0 "The battleship is vulnerable from the air. We will build an air arm to strike at enemy fleets far out at sea."
 rpx_air3_naval_bombers:0 "Naval Bombers"
 rpx_air3_naval_bombers_desc:0 "Aircraft armed against ships can decide a naval war. We will develop and deploy dedicated naval bombers."
 rpx_air3_maritime_patrol:0 "Maritime Patrol"
 rpx_air3_maritime_patrol_desc:0 "The sea lanes must be watched and guarded. We will build a maritime patrol force to find and report the enemy fleet."
 rpx_air3_naval_aviation:0 "Naval Aviation"
 rpx_air3_naval_aviation_desc:0 "The aircraft carrier brings air power to the fleet. We will develop naval aviation to serve from our warships."
 rpx_air3_nav_squadrons:0 "Naval Bomber Squadrons"
 rpx_air3_nav_squadrons_desc:0 "Squadrons trained to strike at sea will hunt the enemy fleet. We will raise them in strength."
 rpx_air3_naval_capstone:0 "Naval Air Doctrine"
 rpx_air3_naval_capstone_desc:0 "Air and sea power have been forged into one weapon. We will codify the doctrine of naval air warfare."
 rpx_air3_strategic_recon:0 "Strategic Reconnaissance"
 rpx_air3_strategic_recon_desc:0 "The eye of the air force guides the bombs of the bombers. We will build a strategic reconnaissance capability."
 rpx_air3_photo_recon:0 "Photo Reconnaissance"
 rpx_air3_photo_recon_desc:0 "A camera can see what no spy can reach. We will develop high-flying photo reconnaissance over enemy territory."
 rpx_air3_scout_squadrons:0 "Scout Squadrons"
 rpx_air3_scout_squadrons_desc:0 "Swift reconnaissance aircraft will range ahead of our forces. We will raise dedicated scout squadrons."
 rpx_air3_doctrine_research:0 "Air Doctrine Research"
 rpx_air3_doctrine_research_desc:0 "Victory in the air belongs to those who study it. We will fund research into the operational doctrines of aerial warfare."
 rpx_air3_officer_corps:0 "Air Officer Corps"
 rpx_air3_officer_corps_desc:0 "Officers provide the leadership that wins air campaigns. We will train a professional cadre of air commanders."
 rpx_air3_pilot_training:0 "Pilot Training"
 rpx_air3_pilot_training_desc:0 "A modern air force needs thousands of trained pilots. We will build a comprehensive training program to keep our squadrons crewed."
 rpx_air3_command_structure:0 "Air Command Structure"
 rpx_air3_command_structure_desc:0 "Clear chains of command and effective staff work make an air force formidable. We will reorganize our command structure for efficiency."
 rpx_air3_ace_training:0 "Ace Training"
 rpx_air3_ace_training_desc:0 "Great pilots are made, not born. We will expand our training to produce the aces who can tip the balance in the air."
 rpx_air3_master_pilots:0 "Master Pilots"
 rpx_air3_master_pilots_desc:0 "The finest airmen in the world fly for our colors. We will raise an elite cadre of master pilots to lead our squadrons."
 rpx_air3_base_expansion:0 "Air Base Expansion"
 rpx_air3_base_expansion_desc:0 "Our airfields must be expanded to handle more aircraft and larger formations. We will invest in our base infrastructure."
 rpx_air3_airfields:0 "Airfields"
 rpx_air3_airfields_desc:0 "Modern airfields with good facilities keep our air force flying. We will construct and improve airfields across the nation."
 rpx_air3_maintenance:0 "Aircraft Maintenance"
 rpx_air3_maintenance_desc:0 "A well-maintained aircraft is a serviceable aircraft. We will improve our maintenance facilities to keep more planes in the air."
 rpx_air3_fuel:0 "Fuel Reserves"
 rpx_air3_fuel_desc:0 "An air force without fuel is a grounded air force. We will build up reserves of aviation fuel for sustained operations."
 rpx_air3_all_weather:0 "All-Weather Operations"
 rpx_air3_all_weather_desc:0 "The weather must never ground our air force. We will develop the instruments and training to fly in all conditions."
 rpx_air3_supreme_air_power:0 "Supreme Air Power"
 rpx_air3_supreme_air_power_desc:0 "The mastery of the air is the mastery of the war. We will build an air force without equal, ready to decide the fate of nations from the skies."
 rpx_army1_military_reform:0 "Military Reform"
 rpx_army1_military_reform_desc:0 "Every great army begins with reform. We will modernize the organization, doctrine and institutions of our armed forces to prepare for the wars to come."
 rpx_army1_infantry_weapons:0 "Infantry Weapons"
 rpx_army1_infantry_weapons_desc:0 "The rifle is the soldier's best friend. We will equip our infantry with modern weapons and develop the next generation of small arms."
 rpx_army1_mass_infantry:0 "Mass Infantry"
 rpx_army1_mass_infantry_desc:0 "Wars are won by the nation that can raise and sustain great armies. We will build an infantry force of overwhelming size."
 rpx_army1_elite_infantry:0 "Elite Infantry"
 rpx_army1_elite_infantry_desc:0 "Quality can outweigh quantity. We will train a core of elite infantry units able to break through where ordinary troops cannot."
 rpx_army1_mobile_infantry:0 "Mobile Infantry"
 rpx_army1_mobile_infantry_desc:0 "The infantry that moves fast fights fast. We will motorize and reorganize our infantry for rapid movement on the battlefield."
 rpx_army1_special_forces:0 "Special Forces"
 rpx_army1_special_forces_desc:0 "Specially trained troops can accomplish what conventional forces cannot. We will raise our special forces to their full strength."
 rpx_army1_mass_conscription:0 "Mass Conscription"
 rpx_army1_mass_conscription_desc:0 "In the hour of danger, the nation arms itself. We will expand conscription to fill our ranks with trained reserves."
 rpx_army1_armor_program:0 "Armor Program"
 rpx_army1_armor_program_desc:0 "The tank has transformed modern warfare. We will build an armored force able to break through enemy lines and exploit the breach."
 rpx_army1_light_armor_division:0 "Light Armor Divisions"
 rpx_army1_light_armor_division_desc:0 "Fast, mobile tank divisions can strike where the enemy is weak. We will develop and field light armor divisions."
 rpx_army1_heavy_armor_division:0 "Heavy Armor Divisions"
 rpx_army1_heavy_armor_division_desc:0 "Heavy tanks crush defenses that lighter vehicles cannot. We will develop and field heavy armor divisions."
 rpx_army1_mechanized_infantry:0 "Mechanized Infantry"
 rpx_army1_mechanized_infantry_desc:0 "Infantry carried in armored vehicles keeps pace with the tanks. We will develop mechanized infantry to support our armor."
 rpx_army1_heavy_breakthrough:0 "Heavy Breakthrough"
 rpx_army1_heavy_breakthrough_desc:0 "A concentrated mass of armor can break any front. We will develop the doctrine and forces for a decisive armored breakthrough."
 rpx_army1_armor_industrial_complex:0 "Armor Industrial Complex"
 rpx_army1_armor_industrial_complex_desc:0 "Armored forces demand a vast industrial base. We will build the factories and supply lines to sustain our tank armies."
 rpx_army1_artillery_corps:0 "Artillery Corps"
 rpx_army1_artillery_corps_desc:0 "Artillery is the god of war. We will build a powerful artillery force to support our infantry and armor."
 rpx_army1_field_artillery:0 "Field Artillery"
 rpx_army1_field_artillery_desc:0 "The gun that follows the soldier decides many battles. We will expand and modernize our field artillery."
 rpx_army1_rocket_artillery:0 "Rocket Artillery"
 rpx_army1_rocket_artillery_desc:0 "Rockets can deliver overwhelming firepower in a single barrage. We will develop rocket artillery for massed fire support."
 rpx_army1_artillery_modernization:0 "Artillery Modernization"
 rpx_army1_artillery_modernization_desc:0 "Modern guns and shells multiply the power of our artillery. We will modernize our entire artillery park."
 rpx_army1_rocket_technology:0 "Rocket Technology"
 rpx_army1_rocket_technology_desc:0 "The rocket is a weapon of the future. We will push forward the technology of rocketry for military purposes."
 rpx_army1_firepower_corps:0 "Firepower Corps"
 rpx_army1_firepower_corps_desc:0 "Firepower wins wars. We will concentrate artillery, rockets and heavy weapons into a decisive firepower arm."
 rpx_army1_doctrine_effort:0 "Doctrine Effort"
 rpx_army1_doctrine_effort_desc:0 "An army without a doctrine is an army without a plan. We will develop a coherent doctrine for modern warfare."
 rpx_army1_offensive_doctrine:0 "Offensive Doctrine"
 rpx_army1_offensive_doctrine_desc:0 "The offensive is the decisive form of war. We will develop a doctrine of aggressive, relentless attack."
 rpx_army1_defensive_doctrine:0 "Defensive Doctrine"
 rpx_army1_defensive_doctrine_desc:0 "The defense conserves strength and inflicts ruin on the attacker. We will develop a doctrine of strong, flexible defense."
 rpx_army1_officer_corps:0 "Officer Corps"
 rpx_army1_officer_corps_desc:0 "Officers are the brain of the army. We will train a professional officer corps of the highest quality."
 rpx_army1_fortress_engineering:0 "Fortress Engineering"
 rpx_army1_fortress_engineering_desc:0 "Fortifications can make a nation impenetrable. We will invest in fortress engineering and permanent defenses."
 rpx_army1_grand_offensive:0 "Grand Offensive"
 rpx_army1_grand_offensive_desc:0 "The ultimate test of an army is the great offensive. We will prepare the forces and plans for a decisive strategic attack."
 rpx_army1_impregnable_defense:0 "Impregnable Defense"
 rpx_army1_impregnable_defense_desc:0 "We will make our homeland a fortress that no enemy can take. Our defenses will be made impregnable."
 rpx_army1_field_support:0 "Field Support"
 rpx_army1_field_support_desc:0 "Modern armies march on their stomachs. We will strengthen the support services that keep our troops fighting."
 rpx_army1_motorized_support:0 "Motorized Support"
 rpx_army1_motorized_support_desc:0 "Motor transport moves supplies and troops faster. We will motorize our field support services."
 rpx_army1_supply_support:0 "Supply Support"
 rpx_army1_supply_support_desc:0 "An army out of supply is an army defeated. We will build a robust supply system for our forces."
 rpx_army1_engineer_support:0 "Engineer Support"
 rpx_army1_engineer_support_desc:0 "Engineers build the way to victory. We will strengthen our military engineers and their equipment."
 rpx_army1_motorized_support_2:0 "Motorized Support II"
 rpx_army1_motorized_support_2_desc:0 "A fully motorized support network keeps the army moving at the speed of war. We will complete the motorization of our services."
 rpx_army1_supply_support_2:0 "Supply Support II"
 rpx_army1_supply_support_2_desc:0 "Our supply system must serve a large modern army in the field. We will expand it to its full capability."
 rpx_army1_engineer_support_2:0 "Engineer Support II"
 rpx_army1_engineer_support_2_desc:0 "We will bring our engineer forces to full strength, ready to support operations at every scale."
 rpx_army1_field_support_supremacy:0 "Field Support Supremacy"
 rpx_army1_field_support_supremacy_desc:0 "No army in the world will be better supplied or better supported than ours. We will achieve supremacy in field support."
 rpx_army1_anti_armor_corps:0 "Anti-Armor Corps"
 rpx_army1_anti_armor_corps_desc:0 "The tank is formidable, but not unbeatable. We will build a dedicated anti-armor capability."
 rpx_army1_tank_destroyer_program:0 "Tank Destroyer Program"
 rpx_army1_tank_destroyer_program_desc:0 "Dedicated tank destroyers are the counter to armored onslaught. We will develop and field them in strength."
 rpx_army1_anti_air_network:0 "Anti-Air Network"
 rpx_army1_anti_air_network_desc:0 "Hostile aircraft must not rule our skies. We will build a network of anti-aircraft guns to defend our forces."
 rpx_army1_tank_destroyer_program_2:0 "Tank Destroyer Program II"
 rpx_army1_tank_destroyer_program_2_desc:0 "Our tank destroyer force will be expanded and equipped with the latest weapons. No enemy armor will be safe."
 rpx_army1_anti_air_network_2:0 "Anti-Air Network II"
 rpx_army1_anti_air_network_2_desc:0 "We will thicken our anti-aircraft coverage until hostile air attack becomes prohibitively costly."
 rpx_army1_anti_armor_supremacy:0 "Anti-Armor Supremacy"
 rpx_army1_anti_armor_supremacy_desc:0 "Our forces will be able to defeat any armored assault. We will achieve supremacy in anti-armor warfare."
 rpx_army1_mass_war_machine:0 "Mass War Machine"
 rpx_army1_mass_war_machine_desc:0 "Our armies will be a vast machine of war, able to absorb and inflict enormous losses. We will build for total war."
 rpx_army1_elite_combined_arms:0 "Elite Combined Arms"
 rpx_army1_elite_combined_arms_desc:0 "Our elite forces will master the combined use of infantry, armor and firepower. They will be decisive instruments of victory."
 rpx_army1_elite_supremacy:0 "Elite Supremacy"
 rpx_army1_elite_supremacy_desc:0 "No force on earth can match our elite troops. We will forge them into an instrument of overwhelming quality."
 rpx_army1_armor_dominance:0 "Armor Dominance"
 rpx_army1_armor_dominance_desc:0 "Our armored forces will dominate every battlefield. We will achieve complete dominance in armored warfare."
 rpx_army1_firepower_dominance:0 "Firepower Dominance"
 rpx_army1_firepower_dominance_desc:0 "The enemy will be buried under our firepower. We will achieve complete dominance in artillery and fire support."
 rpx_army1_offensive_dominance:0 "Offensive Dominance"
 rpx_army1_offensive_dominance_desc:0 "Our armies will attack, and attack again, until the enemy breaks. We will achieve dominance of the offensive."
 rpx_army1_defensive_dominance:0 "Defensive Dominance"
 rpx_army1_defensive_dominance_desc:0 "No enemy will breach our defenses. We will achieve complete dominance in defensive warfare."
 rpx_army1_combined_arms:0 "Combined Arms"
 rpx_army1_combined_arms_desc:0 "Infantry, armor and artillery fighting together are unstoppable. We will perfect the combined arms battle."
 rpx_army1_war_machine:0 "War Machine"
 rpx_army1_war_machine_desc:0 "The entire nation will be forged into a single war machine. Every factory, every farm and every citizen will serve the army."
 rpx_army1_absolute_dominance:0 "Absolute Dominance"
 rpx_army1_absolute_dominance_desc:0 "Our army will be the greatest the world has ever seen. In every arm and every doctrine we will achieve absolute dominance."
 rpx_army2_army_modernization:0 "Army Modernization"
 rpx_army2_army_modernization_desc:0 "The armies of the future will be fast, powerful and well supplied. We will modernize every branch of our army to meet that future."
 rpx_army2_armor_development:0 "Armor Development"
 rpx_army2_armor_development_desc:0 "The tank is the decisive weapon of modern war. We will develop a new generation of armored fighting vehicles."
 rpx_army2_light_armor_squadrons:0 "Light Armor Squadrons"
 rpx_army2_light_armor_squadrons_desc:0 "Light, fast tank formations can outrun and outflank the enemy. We will build armored squadrons of light tanks."
 rpx_army2_medium_tank_program:0 "Medium Tank Program"
 rpx_army2_medium_tank_program_desc:0 "The medium tank balances speed, armor and firepower. We will develop it as the mainstay of our armored forces."
 rpx_army2_heavy_tank_program:0 "Heavy Tank Program"
 rpx_army2_heavy_tank_program_desc:0 "Heavy tanks break through the strongest defenses. We will develop them to lead our armored assault."
 rpx_army2_armored_recon:0 "Armored Reconnaissance"
 rpx_army2_armored_recon_desc:0 "Armored reconnaissance finds the enemy and the gaps in his lines. We will develop fast armored recon units."
 rpx_army2_tank_destroyer_support:0 "Tank Destroyer Support"
 rpx_army2_tank_destroyer_support_desc:0 "Tank destroyers are the hunters of enemy armor. We will build them to support our armored forces."
 rpx_army2_armored_spearhead:0 "Armored Spearhead"
 rpx_army2_armored_spearhead_desc:0 "Concentrated armor forms the spearhead of our attack. We will organize our tanks into a decisive striking force."
 rpx_army2_armor_industrial_base:0 "Armor Industrial Base"
 rpx_army2_armor_industrial_base_desc:0 "Tank armies are built in factories, not on battlefields. We will construct the industrial base to mass-produce armor."
 rpx_army2_artillery_command:0 "Artillery Command"
 rpx_army2_artillery_command_desc:0 "Artillery must be commanded as a unified arm. We will establish a dedicated command for our guns and rockets."
 rpx_army2_field_artillery:0 "Field Artillery"
 rpx_army2_field_artillery_desc:0 "The gun that follows the soldier decides many battles. We will expand and modernize our field artillery."
 rpx_army2_self_propelled_artillery:0 "Self-Propelled Artillery"
 rpx_army2_self_propelled_artillery_desc:0 "Guns that move with the tanks keep up with the battle. We will develop self-propelled artillery."
 rpx_army2_rocket_development:0 "Rocket Development"
 rpx_army2_rocket_development_desc:0 "Rockets deliver devastating barrages from light launchers. We will develop rocket weapons for the army."
 rpx_army2_rocket_mastery:0 "Rocket Mastery"
 rpx_army2_rocket_mastery_desc:0 "We will master the rocket as a weapon of mass fire support. Our rocket forces will be without equal."
 rpx_army2_firepower_integration:0 "Firepower Integration"
 rpx_army2_firepower_integration_desc:0 "All our firepower must be integrated into a single system of battle. We will perfect the coordination of guns and rockets."
 rpx_army2_elite_forces:0 "Elite Forces"
 rpx_army2_elite_forces_desc:0 "Elite troops can achieve what ordinary soldiers cannot. We will raise and equip our elite forces to full strength."
 rpx_army2_special_forces_corps:0 "Special Forces Corps"
 rpx_army2_special_forces_corps_desc:0 "Our special forces will be organized into a powerful corps. They will strike where the enemy least expects."
 rpx_army2_amphibious_warfare:0 "Amphibious Warfare"
 rpx_army2_amphibious_warfare_desc:0 "Landings from the sea can turn an enemy's flank. We will develop the doctrine and craft of amphibious assault."
 rpx_army2_airborne_forces:0 "Airborne Forces"
 rpx_army2_airborne_forces_desc:0 "Paratroopers can seize the key points behind enemy lines. We will raise a capable airborne force."
 rpx_army2_winter_warfare:0 "Winter Warfare"
 rpx_army2_winter_warfare_desc:0 "The cold can be a worse enemy than the foe. We will train our troops to fight and survive in winter conditions."
 rpx_army2_elite_combined_training:0 "Elite Combined Training"
 rpx_army2_elite_combined_training_desc:0 "Our elite forces will train together until they act as one. We will forge them into a combined arms instrument of the highest order."
 rpx_army2_conscription_reform:0 "Conscription Reform"
 rpx_army2_conscription_reform_desc:0 "The strength of an army lies in the nation behind it. We will reform conscription to raise our armies to full power."
 rpx_army2_total_mobilization:0 "Total Mobilization"
 rpx_army2_total_mobilization_desc:0 "The entire nation will be mobilized for war. Every resource and every citizen will serve the cause of victory."
 rpx_army2_rapid_mobilization:0 "Rapid Mobilization"
 rpx_army2_rapid_mobilization_desc:0 "We must arm quickly, before the enemy strikes. We will streamline mobilization to put trained men under arms without delay."
 rpx_army2_mass_production_infantry:0 "Mass Production Infantry"
 rpx_army2_mass_production_infantry_desc:0 "Simple weapons, produced in their millions, equip great armies. We will standardize our infantry equipment for mass production."
 rpx_army2_war_college:0 "War College"
 rpx_army2_war_college_desc:0 "Generals are made in the war college. We will establish the institutions to train our commanders in the art of war."
 rpx_army2_offensive_doctrine:0 "Offensive Doctrine"
 rpx_army2_offensive_doctrine_desc:0 "The offensive is the decisive form of war. We will develop a doctrine of aggressive, relentless attack."
 rpx_army2_defensive_doctrine:0 "Defensive Doctrine"
 rpx_army2_defensive_doctrine_desc:0 "The defense conserves strength and inflicts ruin on the attacker. We will develop a doctrine of strong, flexible defense."
 rpx_army2_central_command:0 "Central Command"
 rpx_army2_central_command_desc:0 "A single hand must direct the army. We will establish a central command to plan and coordinate all military operations."
 rpx_army2_fortress_doctrine:0 "Fortress Doctrine"
 rpx_army2_fortress_doctrine_desc:0 "Fortifications can make a nation impenetrable. We will develop a doctrine of static defense built on forts and obstacles."
 rpx_army2_blitzkrieg_doctrine:0 "Blitzkrieg Doctrine"
 rpx_army2_blitzkrieg_doctrine_desc:0 "Speed and concentration break the enemy's will to resist. We will develop the doctrine of lightning war."
 rpx_army2_steel_wall_doctrine:0 "Steel Wall Doctrine"
 rpx_army2_steel_wall_doctrine_desc:0 "Our defenses will be an unbreakable wall of steel. We will develop the doctrine of an invulnerable defense."
 rpx_army2_motorized_corps:0 "Motorized Corps"
 rpx_army2_motorized_corps_desc:0 "Motorized formations move at the speed of the tank. We will build motorized corps to support our armor."
 rpx_army2_light_mobile_infantry:0 "Light Mobile Infantry"
 rpx_army2_light_mobile_infantry_desc:0 "Light, mobile infantry can keep pace with fast-moving operations. We will raise them for the mobile battle."
 rpx_army2_mechanized_corps:0 "Mechanized Corps"
 rpx_army2_mechanized_corps_desc:0 "Mechanized infantry rides into battle in armored vehicles. We will build mechanized corps of the highest quality."
 rpx_army2_light_mobile_infantry_2:0 "Light Mobile Infantry II"
 rpx_army2_light_mobile_infantry_2_desc:0 "We will bring our light mobile infantry to full strength, ready for operations across every front."
 rpx_army2_mechanized_corps_2:0 "Mechanized Corps II"
 rpx_army2_mechanized_corps_2_desc:0 "Our mechanized forces will be expanded into a powerful strategic reserve. They will support every major operation."
 rpx_army2_mobile_supremacy:0 "Mobile Supremacy"
 rpx_army2_mobile_supremacy_desc:0 "No army will outmaneuver ours. We will achieve supremacy in mobile warfare."
 rpx_army2_supply_corps:0 "Supply Corps"
 rpx_army2_supply_corps_desc:0 "An army out of supply is an army defeated. We will build a dedicated supply corps for our forces."
 rpx_army2_logistics_network:0 "Logistics Network"
 rpx_army2_logistics_network_desc:0 "Railways, roads and depots keep the army in the fight. We will build a comprehensive logistics network."
 rpx_army2_convoy_support:0 "Convoy Support"
 rpx_army2_convoy_support_desc:0 "Overseas operations depend on secure sea supply. We will organize convoy support to keep our armies supplied."
 rpx_army2_logistics_network_2:0 "Logistics Network II"
 rpx_army2_logistics_network_2_desc:0 "We will expand our logistics network until no army of ours is ever short of supply."
 rpx_army2_convoy_support_2:0 "Convoy Support II"
 rpx_army2_convoy_support_2_desc:0 "Our convoy system will be made secure and efficient. No distant army of ours will go hungry."
 rpx_army2_logistics_supremacy:0 "Logistics Supremacy"
 rpx_army2_logistics_supremacy_desc:0 "Supply wins campaigns. We will achieve supremacy in logistics and sustain our armies wherever they fight."
 rpx_army2_armor_supremacy:0 "Armor Supremacy"
 rpx_army2_armor_supremacy_desc:0 "Our armored forces will dominate every battlefield. We will achieve complete supremacy in armor."
 rpx_army2_firepower_supremacy:0 "Firepower Supremacy"
 rpx_army2_firepower_supremacy_desc:0 "The enemy will be buried under our firepower. We will achieve complete supremacy in artillery and fire support."
 rpx_army2_elite_supremacy:0 "Elite Supremacy"
 rpx_army2_elite_supremacy_desc:0 "No force on earth can match our elite troops. We will forge them into an instrument of overwhelming quality."
 rpx_army2_steel_wall_supremacy:0 "Steel Wall Supremacy"
 rpx_army2_steel_wall_supremacy_desc:0 "Our defenses will be invulnerable. We will achieve supremacy in defensive warfare."
 rpx_army2_grand_blitzkrieg:0 "Grand Blitzkrieg"
 rpx_army2_grand_blitzkrieg_desc:0 "One great blow will decide the war. We will prepare the forces and the plan for a strategic lightning campaign."
 rpx_army2_combined_arms:0 "Combined Arms"
 rpx_army2_combined_arms_desc:0 "Infantry, armor and artillery fighting together are unstoppable. We will perfect the combined arms battle."
 rpx_army2_elite_combined_arms:0 "Elite Combined Arms"
 rpx_army2_elite_combined_arms_desc:0 "Our elite forces will master the combined use of infantry, armor and firepower. They will be decisive instruments of victory."
 rpx_army2_war_machine:0 "War Machine"
 rpx_army2_war_machine_desc:0 "The entire nation will be forged into a single war machine. Every factory, every farm and every citizen will serve the army."
 rpx_army2_absolute_dominance:0 "Absolute Dominance"
 rpx_army2_absolute_dominance_desc:0 "Our army will be the greatest the world has ever seen. In every arm and every doctrine we will achieve absolute dominance."
 rpx_econ1_industrial_foundation:0 "Industrial Foundation"
 rpx_econ1_industrial_foundation_desc:0 "The modern state is built on industry. We must lay the groundwork for a strong and prosperous industrial base that can support the nation in peace and war alike."
 rpx_econ1_civ_build_up:0 "Civilian Build-Up"
 rpx_econ1_civ_build_up_desc:0 "A strong civilian industry is the foundation of every other branch of the economy. We will build new civilian factories to power our future growth."
 rpx_econ1_expanded_civ_industry:0 "Expanded Civilian Industry"
 rpx_econ1_expanded_civ_industry_desc:0 "Our civilian industrial base grows ever larger. Additional factories will be constructed to meet the demands of a modernizing economy."
 rpx_econ1_industrial_research:0 "Industrial Research"
 rpx_econ1_industrial_research_desc:0 "New machinery and techniques can multiply the output of our factories. We will fund research into the construction and industrial technologies of tomorrow."
 rpx_econ1_civilian_planning:0 "Civilian Planning"
 rpx_econ1_civilian_planning_desc:0 "An economy run by plan rather than chance is an economy that grows. We will organize our civilian production to reduce waste and increase stability."
 rpx_econ1_industrial_standardization:0 "Industrial Standardization"
 rpx_econ1_industrial_standardization_desc:0 "Standardized parts and processes allow our factories to produce more with less. We will introduce common standards across our entire industrial sector."
 rpx_econ1_advanced_industry:0 "Advanced Industry"
 rpx_econ1_advanced_industry_desc:0 "To keep pace with the great powers we must master the latest in industrial science. We will expand our research establishment and push the boundaries of industry and electronics."
 rpx_econ1_infrastructure_campaign:0 "Infrastructure Campaign"
 rpx_econ1_infrastructure_campaign_desc:0 "Roads, bridges and railways bind the nation together. We will launch a campaign to modernize and expand our infrastructure."
 rpx_econ1_expanded_infrastructure:0 "Expanded Infrastructure"
 rpx_econ1_expanded_infrastructure_desc:0 "Our infrastructure network must reach every corner of the nation. We will continue to build roads and railways to connect our provinces."
 rpx_econ1_construction_modernization:0 "Construction Modernization"
 rpx_econ1_construction_modernization_desc:0 "Modern construction techniques allow us to build faster and cheaper. We will reform our construction industry to speed up every building project."
 rpx_econ1_railway_expansion:0 "Railway Expansion"
 rpx_econ1_railway_expansion_desc:0 "The railway is the backbone of a modern economy and army. We will expand and improve our rail network to move goods and troops with speed."
 rpx_econ1_mil_build_up:0 "Military Build-Up"
 rpx_econ1_mil_build_up_desc:0 "A nation must be able to defend itself. We will construct military factories to supply our armed forces with the equipment they need."
 rpx_econ1_expanded_mil_industry:0 "Expanded Military Industry"
 rpx_econ1_expanded_mil_industry_desc:0 "Our military industrial capacity is growing. More arms factories will be built to keep our armed forces well supplied."
 rpx_econ1_military_standardization:0 "Military Standardization"
 rpx_econ1_military_standardization_desc:0 "Standardized weapons and vehicles are easier to produce and maintain. We will bring common standards to our military industry."
 rpx_econ1_conversion_program:0 "Conversion Program"
 rpx_econ1_conversion_program_desc:0 "In wartime, civilian factories can be converted to military production. We will prepare the machinery and plans to convert our industry to the needs of war."
 rpx_econ1_resource_prospecting:0 "Resource Prospecting"
 rpx_econ1_resource_prospecting_desc:0 "Our nation's true mineral wealth may lie undiscovered beneath our soil. We will fund prospecting expeditions to find the resources we need."
 rpx_econ1_synthetic_production:0 "Synthetic Production"
 rpx_econ1_synthetic_production_desc:0 "Not all resources can be dug from the earth. We will develop the synthetic industries that can produce fuel and rubber from domestic materials."
 rpx_econ1_resource_efficiency:0 "Resource Efficiency"
 rpx_econ1_resource_efficiency_desc:0 "Waste is the enemy of industry. We will improve our extraction and processing methods to get more from every mine and every ton of ore."
 rpx_econ1_economic_policy:0 "Economic Policy"
 rpx_econ1_economic_policy_desc:0 "The direction of our economy is a political choice. We must decide whether to prioritize the consumer, the trader or the soldier."
 rpx_econ1_policy_consumer:0 "Consumer Economy"
 rpx_econ1_policy_consumer_desc:0 "A contented people is a productive people. We will allow our citizens to enjoy the fruits of their labor, keeping the nation stable and happy."
 rpx_econ1_policy_consumer_2:0 "Full Employment"
 rpx_econ1_policy_consumer_2_desc:0 "Everyone deserves a share in the nation's prosperity. We will ensure full employment and raise the standard of living of our people."
 rpx_econ1_policy_trade:0 "Free Trade"
 rpx_econ1_policy_trade_desc:0 "Trade enriches all who take part in it. We will open our markets and import the resources and goods we cannot produce ourselves."
 rpx_econ1_policy_trade_2:0 "Trade Expansion"
 rpx_econ1_policy_trade_2_desc:0 "Our merchants will range far and wide across the globe. We will expand our trade networks and strengthen our position in the world market."
 rpx_econ1_policy_military:0 "War Economy"
 rpx_econ1_policy_military_desc:0 "When war is inevitable, the economy must serve the army. We will place our industry on a war footing to prepare for the coming conflict."
 rpx_econ1_policy_military_2:0 "Military Industrialization"
 rpx_econ1_policy_military_2_desc:0 "The entire nation will be turned toward the production of arms. Our military industry will be expanded to supply a vast army."
 rpx_econ1_dockyard_program:0 "Dockyard Program"
 rpx_econ1_dockyard_program_desc:0 "Sea power requires shipyards. We will build new dockyards to support the construction of a modern fleet."
 rpx_econ1_expanded_dockyards:0 "Expanded Dockyards"
 rpx_econ1_expanded_dockyards_desc:0 "Our shipbuilding capacity must grow to meet the demands of the navy. We will expand our dockyards and improve their output."
 rpx_econ1_naval_supply_chain:0 "Naval Supply Chain"
 rpx_econ1_naval_supply_chain_desc:0 "A fleet is only as strong as its supply lines. We will streamline the logistics that keep our navy fueled and supplied."
 rpx_econ1_maritime_economy:0 "Maritime Economy"
 rpx_econ1_maritime_economy_desc:0 "Our seas are a source of wealth and power. We will develop our maritime economy to support a larger and more capable navy."
 rpx_econ1_labor_program:0 "Labor Program"
 rpx_econ1_labor_program_desc:0 "The worker is the heart of the economy. We will improve labor organization to make our factories more productive."
 rpx_econ1_skilled_workforce:0 "Skilled Workforce"
 rpx_econ1_skilled_workforce_desc:0 "Machines are only as good as the hands that operate them. We will train a skilled workforce to run our industries efficiently."
 rpx_econ1_labor_conditions:0 "Labor Conditions"
 rpx_econ1_labor_conditions_desc:0 "Contented workers are productive workers. We will improve working conditions and raise the living standards of our labor force."
 rpx_econ1_armament_drive:0 "Armament Drive"
 rpx_econ1_armament_drive_desc:0 "The drums of war grow louder. We will drive our industry to produce the weapons our army needs, whatever the cost."
 rpx_econ1_rearmament_program:0 "Rearmament Program"
 rpx_econ1_rearmament_program_desc:0 "We must rearm, and rearm quickly. A balanced program of military production will rebuild our armed forces."
 rpx_econ1_resource_autarky:0 "Resource Autarky"
 rpx_econ1_resource_autarky_desc:0 "A nation dependent on imports is a nation vulnerable to blockade. We will strive to make ourselves self-sufficient in resources."
 rpx_econ1_economic_modernization:0 "Economic Modernization"
 rpx_econ1_economic_modernization_desc:0 "Our economy stands on the threshold of greatness. We will modernize our industries, infrastructure and institutions to build a truly modern economy."
 rpx_econ1_total_industrialization:0 "Total Industrialization"
 rpx_econ1_total_industrialization_desc:0 "The entire nation will become a single great factory. We will mobilize every resource and every worker to achieve total industrialization."
 rpx_econ2_war_economy_foundation:0 "War Economy Foundation"
 rpx_econ2_war_economy_foundation_desc:0 "A nation at war is a nation at work. We will lay the foundation of an economy built for the demands of total war."
 rpx_econ2_heavy_machinery:0 "Heavy Machinery"
 rpx_econ2_heavy_machinery_desc:0 "Every factory needs its machines. We will invest in the heavy machinery that powers our industrial output."
 rpx_econ2_assembly_lines:0 "Assembly Lines"
 rpx_econ2_assembly_lines_desc:0 "The assembly line multiplies the work of every worker. We will introduce modern mass production methods to our factories."
 rpx_econ2_automation:0 "Automation"
 rpx_econ2_automation_desc:0 "Machines that run themselves free men for other tasks. We will automate our production processes where possible."
 rpx_econ2_industrial_dominance:0 "Industrial Dominance"
 rpx_econ2_industrial_dominance_desc:0 "Our industry will outproduce every rival. We will pursue complete dominance of industrial production."
 rpx_econ2_mobilize_construction:0 "Mobilize Construction"
 rpx_econ2_mobilize_construction_desc:0 "Every new factory is a weapon. We will mobilize our construction industry to build faster than ever."
 rpx_econ2_rail_network:0 "Rail Network"
 rpx_econ2_rail_network_desc:0 "Railways are the arteries of the economy. We will expand and modernize our rail network."
 rpx_econ2_construction_conglomerate:0 "Construction Conglomerate"
 rpx_econ2_construction_conglomerate_desc:0 "A great construction conglomerate can build anything, anywhere. We will consolidate our construction industry into a powerful force."
 rpx_econ2_arms_drive:0 "Arms Drive"
 rpx_econ2_arms_drive_desc:0 "The nation must be armed. We will drive our industry to produce weapons in ever greater numbers."
 rpx_econ2_weapons_standardization:0 "Weapons Standardization"
 rpx_econ2_weapons_standardization_desc:0 "Standard weapons are produced faster and maintained easier. We will standardize our weapons across the armed forces."
 rpx_econ2_tank_program:0 "Tank Program"
 rpx_econ2_tank_program_desc:0 "The tank is the decisive weapon of the modern battlefield. We will expand our tank production to meet the needs of war."
 rpx_econ2_conversion_specialist:0 "Conversion Specialist"
 rpx_econ2_conversion_specialist_desc:0 "Civilian industry must be ready to become military industry at a moment's notice. We will master the art of conversion."
 rpx_econ2_resource_expedition:0 "Resource Expedition"
 rpx_econ2_resource_expedition_desc:0 "The earth holds the wealth of nations. We will send expeditions to find and exploit new resource deposits."
 rpx_econ2_synthetic_expansion:0 "Synthetic Expansion"
 rpx_econ2_synthetic_expansion_desc:0 "We must produce what we cannot dig. We will expand our synthetic fuel and rubber industries."
 rpx_econ2_research_consortium:0 "Research Consortium"
 rpx_econ2_research_consortium_desc:0 "United laboratories achieve more than isolated ones. We will establish a national research consortium."
 rpx_econ2_total_resource_mastery:0 "Total Resource Mastery"
 rpx_econ2_total_resource_mastery_desc:0 "No resource will go to waste, none will be left unmined. We will master the full wealth of our nation."
 rpx_econ2_aviation_industry:0 "Aviation Industry"
 rpx_econ2_aviation_industry_desc:0 "Air power is built in the factory. We will build a powerful aviation industry to equip our air force."
 rpx_econ2_naval_industry:0 "Naval Industry"
 rpx_econ2_naval_industry_desc:0 "Sea power is built in the dockyard. We will expand our naval industry to equip a great fleet."
 rpx_econ2_economic_direction:0 "Economic Direction"
 rpx_econ2_economic_direction_desc:0 "The economy must serve a purpose. We will choose the direction of our national economy."
 rpx_econ2_direction_consumer:0 "Consumer Direction"
 rpx_econ2_direction_consumer_desc:0 "A prosperous people is a loyal people. We will direct our economy toward the welfare of the consumer."
 rpx_econ2_direction_consumer_2:0 "Consumer Direction II"
 rpx_econ2_direction_consumer_2_desc:0 "The wealth of the nation will be shared among its citizens. We will build an economy that serves the people."
 rpx_econ2_direction_balanced:0 "Balanced Direction"
 rpx_econ2_direction_balanced_desc:0 "A wise economy balances the needs of the civilian and the soldier. We will pursue a path of balanced growth."
 rpx_econ2_direction_balanced_2:0 "Balanced Direction II"
 rpx_econ2_direction_balanced_2_desc:0 "We will perfect the balance between consumption and production, between peace and preparation."
 rpx_econ2_direction_war:0 "War Direction"
 rpx_econ2_direction_war_desc:0 "Everything for the front. We will direct our entire economy toward the needs of war."
 rpx_econ2_direction_war_2:0 "War Direction II"
 rpx_econ2_direction_war_2_desc:0 "The nation will be a single arsenal. We will complete the conversion of our economy to war production."
 rpx_econ2_logistics_network:0 "Logistics Network"
 rpx_econ2_logistics_network_desc:0 "Goods must reach the factories and the front. We will build a comprehensive logistics network."
 rpx_econ2_supply_chain:0 "Supply Chain"
 rpx_econ2_supply_chain_desc:0 "Every factory depends on its supply chain. We will strengthen the links that keep production moving."
 rpx_econ2_logistics_mastery:0 "Logistics Mastery"
 rpx_econ2_logistics_mastery_desc:0 "He who commands logistics commands victory. We will achieve mastery over the movement of men and materials."
 rpx_econ2_electronics_program:0 "Electronics Program"
 rpx_econ2_electronics_program_desc:0 "Electronics are the nervous system of the modern economy. We will build a strong electronics industry."
 rpx_econ2_computing_machines:0 "Computing Machines"
 rpx_econ2_computing_machines_desc:0 "Machines that calculate can solve problems beyond human reach. We will develop computing machines for science and war."
 rpx_econ2_communications_network:0 "Communications Network"
 rpx_econ2_communications_network_desc:0 "Commands and information must travel instantly. We will build a modern communications network."
 rpx_econ2_mass_production_line:0 "Mass Production Line"
 rpx_econ2_mass_production_line_desc:0 "The mass production line is the engine of modern war. We will build our industries around it."
 rpx_econ2_precision_industry:0 "Precision Industry"
 rpx_econ2_precision_industry_desc:0 "Fine instruments require precision industry. We will develop the exact manufacturing needed for modern weapons."
 rpx_econ2_resource_autarky:0 "Resource Autarky"
 rpx_econ2_resource_autarky_desc:0 "A nation dependent on imports is a nation vulnerable to blockade. We will strive to make ourselves self-sufficient in resources."
 rpx_econ2_economic_miracle:0 "Economic Miracle"
 rpx_econ2_economic_miracle_desc:0 "We will build an economy that astounds the world. Growth, production and prosperity will be our miracle."
 rpx_econ2_total_war_mobilization:0 "Total War Mobilization"
 rpx_econ2_total_war_mobilization_desc:0 "The entire nation will be mobilized for total war. Every factory, every worker and every resource will serve the war effort."
 rpx_econ3_foundation:0 "Economic Foundation"
 rpx_econ3_foundation_desc:0 "Every great economy is built on a solid foundation. We will lay the groundwork of industry and infrastructure for a powerful nation."
 rpx_econ3_civilian_path:0 "Civilian Path"
 rpx_econ3_civilian_path_desc:0 "The strength of a nation lies in the prosperity of its people. We will develop our civilian economy."
 rpx_econ3_consumer_reduction:0 "Consumer Reduction"
 rpx_econ3_consumer_reduction_desc:0 "Every factory freed from consumer goods is a factory serving the nation. We will reduce civilian consumption."
 rpx_econ3_trade_expansion:0 "Trade Expansion"
 rpx_econ3_trade_expansion_desc:0 "Trade brings the world's wealth to our shores. We will expand our commerce with friendly nations."
 rpx_econ3_total_civilian_mobilization:0 "Total Civilian Mobilization"
 rpx_econ3_total_civilian_mobilization_desc:0 "The full might of our civilian economy will be placed at the service of the nation. Nothing will be wasted."
 rpx_econ3_global_trade_hub:0 "Global Trade Hub"
 rpx_econ3_global_trade_hub_desc:0 "Our ports and markets will become the crossroads of the world. We will make our nation the center of global trade."
 rpx_econ3_resource_path:0 "Resource Path"
 rpx_econ3_resource_path_desc:0 "War is fought on the stomach of industry, and industry on its resources. We will secure the resources our nation needs."
 rpx_econ3_deep_mining:0 "Deep Mining"
 rpx_econ3_deep_mining_desc:0 "The riches of the earth lie deep beneath our feet. We will develop deep mining to reach them."
 rpx_econ3_synthetic_industry:0 "Synthetic Industry"
 rpx_econ3_synthetic_industry_desc:0 "We will produce what nature withholds. Synthetic industry will free us from dependence on foreign resources."
 rpx_econ3_geological_breakthrough:0 "Geological Breakthrough"
 rpx_econ3_geological_breakthrough_desc:0 "New knowledge unlocks new wealth. We will push forward geological science to find the resources within our borders."
 rpx_econ3_synthetic_mastery:0 "Synthetic Mastery"
 rpx_econ3_synthetic_mastery_desc:0 "We will master the synthetic production of fuel and rubber. No blockade will ever starve our industry."
 rpx_econ3_military_path:0 "Military Path"
 rpx_econ3_military_path_desc:0 "The economy must serve the soldier. We will develop our industry to arm the nation for war."
 rpx_econ3_light_arms_focus:0 "Light Arms Focus"
 rpx_econ3_light_arms_focus_desc:0 "The rifle and the machine gun equip the millions. We will focus our industry on light arms production."
 rpx_econ3_heavy_equipment_focus:0 "Heavy Equipment Focus"
 rpx_econ3_heavy_equipment_focus_desc:0 "Tanks, guns and heavy weapons decide the great battles. We will focus our industry on heavy equipment."
 rpx_econ3_infantry_doctrine:0 "Infantry Doctrine"
 rpx_econ3_infantry_doctrine_desc:0 "The infantryman remains the master of the battlefield. We will develop the doctrine that gets the most from him."
 rpx_econ3_armored_division:0 "Armored Division"
 rpx_econ3_armored_division_desc:0 "The armored division is the hammer of the modern army. We will build them in strength."
 rpx_econ3_infrastructure_path:0 "Infrastructure Path"
 rpx_econ3_infrastructure_path_desc:0 "Roads, rails and ports bind the nation together. We will develop our infrastructure to the highest standard."
 rpx_econ3_transport_focus:0 "Transport Focus"
 rpx_econ3_transport_focus_desc:0 "Men and materials must move, and move fast. We will focus on the modernization of our transport."
 rpx_econ3_construction_boom:0 "Construction Boom"
 rpx_econ3_construction_boom_desc:0 "A great wave of building will transform the nation. We will launch a construction boom of unprecedented scale."
 rpx_econ3_logistics_mastery:0 "Logistics Mastery"
 rpx_econ3_logistics_mastery_desc:0 "He who commands logistics commands victory. We will achieve mastery over the movement of men and materials."
 rpx_econ3_mega_construction:0 "Mega Construction"
 rpx_econ3_mega_construction_desc:0 "We will build works of a scale never attempted before. Mega projects will reshape our nation."
 rpx_econ3_research_council:0 "Research Council"
 rpx_econ3_research_council_desc:0 "A national research council will coordinate the work of our scientists. We will make science serve the state."
 rpx_econ3_industry_research:0 "Industry Research"
 rpx_econ3_industry_research_desc:0 "Research builds a better factory. We will invest in industrial science and technology."
 rpx_econ3_armament_research:0 "Armament Research"
 rpx_econ3_armament_research_desc:0 "Weapons of tomorrow must be researched today. We will fund the development of new armaments."
 rpx_econ3_breakthrough_science:0 "Breakthrough Science"
 rpx_econ3_breakthrough_science_desc:0 "A single breakthrough can change the war. We will pursue the frontiers of science with all our resources."
 rpx_econ3_industry_research_2:0 "Industry Research II"
 rpx_econ3_industry_research_2_desc:0 "Our industrial research will push production technology to its limits. We will lead the world in industry."
 rpx_econ3_armament_research_2:0 "Armament Research II"
 rpx_econ3_armament_research_2_desc:0 "Our weapons must always be the most advanced. We will drive armament research forward without pause."
 rpx_econ3_breakthrough_science_2:0 "Breakthrough Science II"
 rpx_econ3_breakthrough_science_2_desc:0 "We will break through the frontiers of knowledge. Our scientists will lead the world."
 rpx_econ3_construction_program:0 "Construction Program"
 rpx_econ3_construction_program_desc:0 "Building is the foundation of power. We will launch a comprehensive construction program."
 rpx_econ3_civ_build_program:0 "Civilian Build Program"
 rpx_econ3_civ_build_program_desc:0 "More civilian factories mean a stronger economy. We will build them across the nation."
 rpx_econ3_mil_build_program:0 "Military Build Program"
 rpx_econ3_mil_build_program_desc:0 "More arms factories mean a stronger army. We will build them to equip our forces."
 rpx_econ3_civ_build_program_2:0 "Civilian Build Program II"
 rpx_econ3_civ_build_program_2_desc:0 "We will continue to expand our civilian industry until it can support a vast war machine."
 rpx_econ3_mil_build_program_2:0 "Military Build Program II"
 rpx_econ3_mil_build_program_2_desc:0 "Our military industrial capacity will be expanded to its absolute limit."
 rpx_econ3_naval_economy:0 "Naval Economy"
 rpx_econ3_naval_economy_desc:0 "Sea power is built in the dockyard. We will develop the economy of the sea."
 rpx_econ3_convoy_focus:0 "Convoy Focus"
 rpx_econ3_convoy_focus_desc:0 "The merchant marine keeps the nation alive in war. We will build and protect our convoys."
 rpx_econ3_capital_shipbuilding:0 "Capital Shipbuilding"
 rpx_econ3_capital_shipbuilding_desc:0 "Great ships are the pride of a great navy. We will build up our capital shipbuilding capacity."
 rpx_econ3_convoy_focus_2:0 "Convoy Focus II"
 rpx_econ3_convoy_focus_2_desc:0 "Our convoy fleet will be expanded until no route can be closed to our trade."
 rpx_econ3_capital_shipbuilding_2:0 "Capital Shipbuilding II"
 rpx_econ3_capital_shipbuilding_2_desc:0 "We will build the greatest warships afloat. Our dockyards will be the best in the world."
 rpx_econ3_full_consumer_economy:0 "Full Consumer Economy"
 rpx_econ3_full_consumer_economy_desc:0 "A nation that prospers is a nation that fights. We will give our people the full fruits of their labor."
 rpx_econ3_world_trade_dominance:0 "World Trade Dominance"
 rpx_econ3_world_trade_dominance_desc:0 "Our merchants will dominate the markets of the world. We will rule the currents of trade."
 rpx_econ3_resource_monopoly:0 "Resource Monopoly"
 rpx_econ3_resource_monopoly_desc:0 "He who owns the resources owns the war. We will gain a commanding share of the world's wealth."
 rpx_econ3_fuel_supremacy:0 "Fuel Supremacy"
 rpx_econ3_fuel_supremacy_desc:0 "The modern war machine runs on fuel. We will secure supremacy in fuel production and reserves."
 rpx_econ3_total_infantry_production:0 "Total Infantry Production"
 rpx_econ3_total_infantry_production_desc:0 "Our infantry will never want for weapons. We will achieve total production of infantry equipment."
 rpx_econ3_total_armor_production:0 "Total Armor Production"
 rpx_econ3_total_armor_production_desc:0 "Our tanks will roll from the factories in their thousands. We will achieve total armor production."
 rpx_econ3_continental_logistics:0 "Continental Logistics"
 rpx_econ3_continental_logistics_desc:0 "We will supply armies across a continent. Our logistics will have no limits."
 rpx_econ3_mega_industry:0 "Mega Industry"
 rpx_econ3_mega_industry_desc:0 "Factories of unprecedented scale will rise across the nation. We will build a mega industry."
 rpx_econ3_economic_hegemony:0 "Economic Hegemony"
 rpx_econ3_economic_hegemony_desc:0 "Our economy will dominate the world. No rival will match our production or our wealth."
 rpx_econ3_industrial_heartland:0 "Industrial Heartland"
 rpx_econ3_industrial_heartland_desc:0 "Our industrial heartland will be the strongest in the world. Every factory will be a fortress of production."
 rpx_econ3_war_economy_council:0 "War Economy Council"
 rpx_econ3_war_economy_council_desc:0 "A single council will direct the war economy. Industry, labor and transport will answer to one will."
 rpx_econ3_technological_leap:0 "Technological Leap"
 rpx_econ3_technological_leap_desc:0 "We will leap ahead of every rival in science and technology. The future will belong to us."
 rpx_econ3_total_economic_supremacy:0 "Total Economic Supremacy"
 rpx_econ3_total_economic_supremacy_desc:0 "In production, in wealth, in science, in every measure of economic power, we will be supreme. Nothing will stand against our industry."
 rpx_navy1_fleet_modernization:0 "Fleet Modernization"
 rpx_navy1_fleet_modernization_desc:0 "Sea power will decide the great wars of our age. We will modernize our fleet to meet the challenges of the coming conflict."
 rpx_navy1_battleship_program:0 "Battleship Program"
 rpx_navy1_battleship_program_desc:0 "The battleship is the backbone of the fleet. We will build a new generation of mighty capital ships."
 rpx_navy1_battleship_armor:0 "Battleship Armor"
 rpx_navy1_battleship_armor_desc:0 "A battleship must be a fortress afloat. We will develop ever thicker and better arranged armor."
 rpx_navy1_heavy_guns:0 "Heavy Guns"
 rpx_navy1_heavy_guns_desc:0 "The battleship's argument is the big gun. We will develop heavier and more accurate main batteries."
 rpx_navy1_super_heavy_program:0 "Super-Heavy Program"
 rpx_navy1_super_heavy_program_desc:0 "We will build ships that dwarf all rivals. Our super-heavy capital ships will be the pride of the fleet."
 rpx_navy1_big_gun_doctrine:0 "Big Gun Doctrine"
 rpx_navy1_big_gun_doctrine_desc:0 "Victory at sea belongs to the big gun. We will develop the doctrine of battleship warfare to its fullest."
 rpx_navy1_battleship_squadron:0 "Battleship Squadron"
 rpx_navy1_battleship_squadron_desc:0 "Battleships fight in squadrons, not alone. We will organize our capital ships into powerful battle squadrons."
 rpx_navy1_naval_fire_support:0 "Naval Fire Support"
 rpx_navy1_naval_fire_support_desc:0 "The guns of the fleet can break an army's defense. We will develop naval fire support for our amphibious operations."
 rpx_navy1_fast_battleship:0 "Fast Battleships"
 rpx_navy1_fast_battleship_desc:0 "Speed lets the battleship choose its battles. We will build fast battleships able to run down any foe."
 rpx_navy1_carrier_program:0 "Carrier Program"
 rpx_navy1_carrier_program_desc:0 "The aircraft carrier is the future of sea power. We will build a new generation of carriers."
 rpx_navy1_carrier_flight_deck:0 "Carrier Flight Deck"
 rpx_navy1_carrier_flight_deck_desc:0 "The flight deck is the carrier's battlefield. We will perfect the design and operation of carrier decks."
 rpx_navy1_carrier_air_group:0 "Carrier Air Group"
 rpx_navy1_carrier_air_group_desc:0 "A carrier is only as good as its aircraft. We will build strong carrier air groups."
 rpx_navy1_carrier_production:0 "Carrier Production"
 rpx_navy1_carrier_production_desc:0 "Carriers are built in numbers, not in ones. We will expand our carrier production capacity."
 rpx_navy1_carrier_doctrine:0 "Carrier Doctrine"
 rpx_navy1_carrier_doctrine_desc:0 "The carrier has changed the shape of naval war. We will develop the doctrine of carrier operations."
 rpx_navy1_fast_carrier:0 "Fast Carriers"
 rpx_navy1_fast_carrier_desc:0 "Fast carriers can strike and withdraw before the enemy responds. We will build carriers of great speed."
 rpx_navy1_carrier_squadrons:0 "Carrier Squadrons"
 rpx_navy1_carrier_squadrons_desc:0 "Carrier squadrons will range across the oceans. We will raise and train them in strength."
 rpx_navy1_carrier_strike_force:0 "Carrier Strike Force"
 rpx_navy1_carrier_strike_force_desc:0 "A concentrated carrier strike force is the deadliest weapon at sea. We will build and organize one."
 rpx_navy1_carrier_capstone:0 "Carrier Aviation Mastery"
 rpx_navy1_carrier_capstone_desc:0 "We will master carrier aviation as the decisive arm of the fleet. The enemy will fear our carriers above all."
 rpx_navy1_cruiser_program:0 "Cruiser Program"
 rpx_navy1_cruiser_program_desc:0 "Cruisers are the workhorses of the fleet. We will build a modern and powerful cruiser force."
 rpx_navy1_light_cruiser_squadrons:0 "Light Cruiser Squadrons"
 rpx_navy1_light_cruiser_squadrons_desc:0 "Light cruisers screen the fleet and raid the enemy's commerce. We will raise their squadrons."
 rpx_navy1_torpedo_cruiser_program:0 "Torpedo Cruiser Program"
 rpx_navy1_torpedo_cruiser_program_desc:0 "The torpedo gives the cruiser a deadly sting. We will develop torpedo-armed cruisers."
 rpx_navy1_armored_cruisers:0 "Armored Cruisers"
 rpx_navy1_armored_cruisers_desc:0 "Armor lets the cruiser stand in the line of battle. We will build cruisers capable of heavy combat."
 rpx_navy1_cruiser_warfare:0 "Cruiser Warfare"
 rpx_navy1_cruiser_warfare_desc:0 "Cruisers fight the long war of the seas. We will develop the doctrine of cruiser warfare."
 rpx_navy1_cruiser_flotillas:0 "Cruiser Flotillas"
 rpx_navy1_cruiser_flotillas_desc:0 "Cruiser flotillas will sweep the seas of the enemy. We will raise them in numbers."
 rpx_navy1_destroyer_program:0 "Destroyer Program"
 rpx_navy1_destroyer_program_desc:0 "Destroyers are the escorts and the hunters of the fleet. We will build them in numbers."
 rpx_navy1_screen_doctrine:0 "Screen Doctrine"
 rpx_navy1_screen_doctrine_desc:0 "The screen protects the battle line from submarine and torpedo. We will develop the doctrine of screening."
 rpx_navy1_anti_submarine:0 "Anti-Submarine Warfare"
 rpx_navy1_anti_submarine_desc:0 "The submarine is the hidden assassin of the seas. We will develop the means to hunt and destroy it."
 rpx_navy1_convoy_protection:0 "Convoy Protection"
 rpx_navy1_convoy_protection_desc:0 "The convoy is the lifeline of a nation at war. We will build the forces to protect our shipping."
 rpx_navy1_escort_training:0 "Escort Training"
 rpx_navy1_escort_training_desc:0 "A trained escort crew saves a thousand ships. We will expand our escort training."
 rpx_navy1_screen_squadrons:0 "Screen Squadrons"
 rpx_navy1_screen_squadrons_desc:0 "Screen squadrons will guard the battle fleet and its convoys. We will raise them in strength."
 rpx_navy1_naval_shipyards:0 "Naval Shipyards"
 rpx_navy1_naval_shipyards_desc:0 "The fleet is built in the shipyards. We will expand our naval construction capacity."
 rpx_navy1_shipbuilding_network:0 "Shipbuilding Network"
 rpx_navy1_shipbuilding_network_desc:0 "A network of shipyards can build a great fleet quickly. We will link our yards into an efficient whole."
 rpx_navy1_advanced_shipbuilding:0 "Advanced Shipbuilding"
 rpx_navy1_advanced_shipbuilding_desc:0 "Advanced techniques build better ships faster. We will master the latest in shipbuilding."
 rpx_navy1_ship_speed_program:0 "Ship Speed Program"
 rpx_navy1_ship_speed_program_desc:0 "Speed is a weapon in itself. We will build faster hulls and engines for our ships."
 rpx_navy1_naval_war_college:0 "Naval War College"
 rpx_navy1_naval_war_college_desc:0 "Admirals are made in the war college. We will establish the institutions to train our naval commanders."
 rpx_navy1_naval_doctrine_research:0 "Naval Doctrine Research"
 rpx_navy1_naval_doctrine_research_desc:0 "Victory at sea belongs to those who study it. We will fund research into naval doctrine."
 rpx_navy1_navy_morale:0 "Navy Morale"
 rpx_navy1_navy_morale_desc:0 "A fleet fights with its spirit as much as its steel. We will keep the morale of our navy high."
 rpx_navy1_combined_arms:0 "Combined Arms"
 rpx_navy1_combined_arms_desc:0 "Battleships, carriers, cruisers and screens must fight as one. We will perfect the combined fleet battle."
 rpx_navy1_officer_corps:0 "Naval Officer Corps"
 rpx_navy1_officer_corps_desc:0 "Officers are the brain of the fleet. We will train a professional naval officer corps."
 rpx_navy1_leadership_training:0 "Leadership Training"
 rpx_navy1_leadership_training_desc:0 "A ship's captain can make or break her crew. We will train our naval leaders to the highest standard."
 rpx_navy1_intelligence:0 "Naval Intelligence"
 rpx_navy1_intelligence_desc:0 "Knowledge of the enemy fleet is the first weapon of the admiral. We will build a powerful naval intelligence service."
 rpx_navy1_fleet_in_being:0 "Fleet in Being"
 rpx_navy1_fleet_in_being_desc:0 "A fleet that remains a threat influences the war without fighting. We will use our fleet in being to tie down the enemy."
 rpx_navy1_battlefleet_capstone:0 "Battlefleet Mastery"
 rpx_navy1_battlefleet_capstone_desc:0 "We will master the great battle of the fleets. Our battlefleet will be ready for its moment of decision."
 rpx_navy1_total_fleet:0 "Total Fleet"
 rpx_navy1_total_fleet_desc:0 "Every type of warship, in every necessary number, will fly our flag. We will build a total fleet without equal."
 rpx_navy2_submarine_command:0 "Submarine Command"
 rpx_navy2_submarine_command_desc:0 "The submarine is the weapon of the weak and the nightmare of the strong. We will build a submarine arm without equal."
 rpx_navy2_submarine_program:0 "Submarine Program"
 rpx_navy2_submarine_program_desc:0 "We will develop a new generation of submarines able to strike at the enemy's commerce and warships."
 rpx_navy2_submarine_fleet:0 "Submarine Fleet"
 rpx_navy2_submarine_fleet_desc:0 "Submarines win their wars in packs. We will build a fleet of submarines large enough to sweep the seas."
 rpx_navy2_torpedo_expertise:0 "Torpedo Expertise"
 rpx_navy2_torpedo_expertise_desc:0 "The torpedo is the submarine's only argument. We will develop the most deadly torpedoes in the world."
 rpx_navy2_submarine_stealth:0 "Submarine Stealth"
 rpx_navy2_submarine_stealth_desc:0 "The submarine lives by being unseen. We will make our boats quieter and harder to detect."
 rpx_navy2_submarine_hunter_killer:0 "Hunter-Killer Operations"
 rpx_navy2_submarine_hunter_killer_desc:0 "Our submarines will hunt the hunters. We will develop hunter-killer tactics for fleet operations."
 rpx_navy2_fleet_submarine_program:0 "Fleet Submarine Program"
 rpx_navy2_fleet_submarine_program_desc:0 "Fleet submarines can range across the oceans with the fleet. We will build large, fast, long-ranged boats."
 rpx_navy2_cruiser_submarines:0 "Cruiser Submarines"
 rpx_navy2_cruiser_submarines_desc:0 "Armed like cruisers, these submarines can fight as well as hide. We will develop large cruiser submarines."
 rpx_navy2_midget_submarines:0 "Midget Submarines"
 rpx_navy2_midget_submarines_desc:0 "Small craft can penetrate where warships cannot. We will develop midget submarines for special operations."
 rpx_navy2_mine_warfare:0 "Mine Warfare"
 rpx_navy2_mine_warfare_desc:0 "The mine is the cheap weapon that costs the enemy dear. We will master the art of mine warfare."
 rpx_navy2_minelaying:0 "Minelaying"
 rpx_navy2_minelaying_desc:0 "Mines can seal a strait or close a port. We will develop minelaying as a weapon of blockade."
 rpx_navy2_minesweeping:0 "Minesweeping"
 rpx_navy2_minesweeping_desc:0 "The enemy's mines must not close our seas. We will develop effective minesweeping forces."
 rpx_navy2_naval_mines_tech:0 "Naval Mine Technology"
 rpx_navy2_naval_mines_tech_desc:0 "Better mines, better fuzes, better laying. We will push forward the technology of the naval mine."
 rpx_navy2_mine_doctrine:0 "Mine Doctrine"
 rpx_navy2_mine_doctrine_desc:0 "Mines are not scattered at random; they are placed by plan. We will develop a doctrine of mine warfare."
 rpx_navy2_sea_mines:0 "Sea Mines"
 rpx_navy2_sea_mines_desc:0 "Our mines will guard our coasts and close the enemy's harbors. We will produce them in their thousands."
 rpx_navy2_convoy_raiding:0 "Convoy Raiding"
 rpx_navy2_convoy_raiding_desc:0 "Strangle the convoy and you strangle the nation. We will develop convoy raiding as a strategic weapon."
 rpx_navy2_raiding_doctrine:0 "Raiding Doctrine"
 rpx_navy2_raiding_doctrine_desc:0 "The raider strikes where the enemy is weak. We will develop the doctrine of the commerce war."
 rpx_navy2_fuel_efficiency:0 "Fuel Efficiency"
 rpx_navy2_fuel_efficiency_desc:0 "Every ton of fuel saved is a ton available to the fleet. We will improve the fuel efficiency of our ships."
 rpx_navy2_base_network:0 "Base Network"
 rpx_navy2_base_network_desc:0 "A fleet needs bases across the oceans. We will build a worldwide network of naval bases."
 rpx_navy2_projection:0 "Naval Projection"
 rpx_navy2_projection_desc:0 "Our fleet must be able to strike anywhere in the world. We will develop the power of naval projection."
 rpx_navy2_expeditionary_training:0 "Expeditionary Training"
 rpx_navy2_expeditionary_training_desc:0 "Our sailors must be ready to operate far from home. We will train them for expeditionary war."
 rpx_navy2_naval_support:0 "Naval Support"
 rpx_navy2_naval_support_desc:0 "Repair, supply and maintenance keep the fleet at sea. We will build our naval support services."
 rpx_navy2_shipyard_network:0 "Shipyard Network"
 rpx_navy2_shipyard_network_desc:0 "A network of shipyards can build a great fleet quickly. We will link our yards into an efficient whole."
 rpx_navy2_submarine_production:0 "Submarine Production"
 rpx_navy2_submarine_production_desc:0 "Submarines must be built in numbers. We will expand our submarine production to its full capacity."
 rpx_navy2_logistics_doctrine:0 "Logistics Doctrine"
 rpx_navy2_logistics_doctrine_desc:0 "He who commands logistics commands the sea. We will develop a doctrine of naval logistics."
 rpx_navy2_naval_academy:0 "Naval Academy"
 rpx_navy2_naval_academy_desc:0 "The naval academy forms the officer of tomorrow. We will expand our institutions of naval education."
 rpx_navy2_doctrine_research:0 "Doctrine Research"
 rpx_navy2_doctrine_research_desc:0 "Victory at sea belongs to those who study it. We will fund research into naval doctrine."
 rpx_navy2_intelligence:0 "Naval Intelligence"
 rpx_navy2_intelligence_desc:0 "Knowledge of the enemy fleet is the first weapon of the admiral. We will build a powerful naval intelligence service."
 rpx_navy2_combined_arms:0 "Combined Arms"
 rpx_navy2_combined_arms_desc:0 "Submarines, surface ships and aircraft must fight as one. We will perfect the combined naval battle."
 rpx_navy2_morale:0 "Navy Morale"
 rpx_navy2_morale_desc:0 "A fleet fights with its spirit as much as its steel. We will keep the morale of our navy high."
 rpx_navy2_critical_hits:0 "Critical Hits"
 rpx_navy2_critical_hits_desc:0 "One well-placed hit can sink the greatest ship. We will train our gunners and torpedo men to strike the vital spot."
 rpx_navy2_leadership:0 "Leadership"
 rpx_navy2_leadership_desc:0 "Admirals decide battles before they are fought. We will cultivate leadership of the highest order in our navy."
 rpx_navy2_u_boat_armada:0 "U-Boat Armada"
 rpx_navy2_u_boat_armada_desc:0 "Our submarines will sail in their hundreds. We will build the great armada that will break the enemy's sea power."
 rpx_navy2_mine_barrage:0 "Mine Barrage"
 rpx_navy2_mine_barrage_desc:0 "A vast barrage of mines will seal the enemy in his ports. We will close the seas to our foes."
 rpx_navy2_total_blockade:0 "Total Blockade"
 rpx_navy2_total_blockade_desc:0 "We will starve the enemy of supplies and hope. Our blockade will be total and unbreakable."
 rpx_navy2_destroyer_program:0 "Destroyer Program"
 rpx_navy2_destroyer_program_desc:0 "Destroyers are the escorts and the hunters of the fleet. We will build them in numbers."
 rpx_navy2_destroyer_escorts:0 "Destroyer Escorts"
 rpx_navy2_destroyer_escorts_desc:0 "Escort destroyers guard the convoys against the wolf packs. We will build them for the battle of the Atlantic."
 rpx_navy2_destroyer_doctrine:0 "Destroyer Doctrine"
 rpx_navy2_destroyer_doctrine_desc:0 "The destroyer is the most versatile ship afloat. We will develop a doctrine for its employment."
 rpx_navy2_destroyer_flotillas:0 "Destroyer Flotillas"
 rpx_navy2_destroyer_flotillas_desc:0 "Destroyer flotillas will sweep the seas of the enemy. We will raise them in numbers."
 rpx_navy2_cruiser_program:0 "Cruiser Program"
 rpx_navy2_cruiser_program_desc:0 "Cruisers are the workhorses of the fleet. We will build a modern and powerful cruiser force."
 rpx_navy2_cruiser_squadrons:0 "Cruiser Squadrons"
 rpx_navy2_cruiser_squadrons_desc:0 "Cruiser squadrons will range the oceans, protecting our commerce and hunting the enemy's. We will raise them."
 rpx_navy2_cruiser_doctrine:0 "Cruiser Doctrine"
 rpx_navy2_cruiser_doctrine_desc:0 "Cruisers fight the long war of the seas. We will develop the doctrine of cruiser warfare."
 rpx_navy2_cruiser_flotillas:0 "Cruiser Flotillas"
 rpx_navy2_cruiser_flotillas_desc:0 "Cruiser flotillas will sweep the seas of the enemy. We will raise them in strength."
 rpx_navy2_heavy_shipyard:0 "Heavy Shipyard"
 rpx_navy2_heavy_shipyard_desc:0 "Great ships require great yards. We will build shipyards capable of constructing the mightiest warships."
 rpx_navy2_battleship_program:0 "Battleship Program"
 rpx_navy2_battleship_program_desc:0 "The battleship is the backbone of the fleet. We will build a new generation of mighty capital ships."
 rpx_navy2_battleship_armor:0 "Battleship Armor"
 rpx_navy2_battleship_armor_desc:0 "A battleship must be a fortress afloat. We will develop ever thicker and better arranged armor."
 rpx_navy2_heavy_guns:0 "Heavy Guns"
 rpx_navy2_heavy_guns_desc:0 "The battleship's argument is the big gun. We will develop heavier and more accurate main batteries."
 rpx_navy2_battleship_squadrons:0 "Battleship Squadrons"
 rpx_navy2_battleship_squadrons_desc:0 "Battleships fight in squadrons, not alone. We will organize our capital ships into powerful battle squadrons."
 rpx_navy3_carrier_aviation:0 "Carrier Aviation"
 rpx_navy3_carrier_aviation_desc:0 "The aircraft carrier has made the battleship obsolete. We will build a navy whose heart is carrier aviation."
 rpx_navy3_carrier_program:0 "Carrier Program"
 rpx_navy3_carrier_program_desc:0 "We will build a new generation of carriers, the capital ships of the coming war."
 rpx_navy3_carrier_air_group:0 "Carrier Air Group"
 rpx_navy3_carrier_air_group_desc:0 "A carrier is only as good as its aircraft. We will build strong carrier air groups."
 rpx_navy3_carrier_pilot_training:0 "Carrier Pilot Training"
 rpx_navy3_carrier_pilot_training_desc:0 "Carrier landings are among the hardest feats of aviation. We will train our naval pilots to master them."
 rpx_navy3_carrier_armor:0 "Carrier Armor"
 rpx_navy3_carrier_armor_desc:0 "Armor lets the carrier survive the hits that would sink lesser ships. We will develop armored carriers."
 rpx_navy3_carrier_operations_doctrine:0 "Carrier Operations Doctrine"
 rpx_navy3_carrier_operations_doctrine_desc:0 "The carrier has changed the shape of naval war. We will develop the doctrine of carrier operations."
 rpx_navy3_fleet_carriers:0 "Fleet Carriers"
 rpx_navy3_fleet_carriers_desc:0 "Fast fleet carriers will strike at the heart of the enemy navy. We will build them in numbers."
 rpx_navy3_mega_carrier:0 "Mega Carrier"
 rpx_navy3_mega_carrier_desc:0 "We will build carriers of unprecedented size, able to carry great air groups and rule the oceans."
 rpx_navy3_carrier_task_force:0 "Carrier Task Force"
 rpx_navy3_carrier_task_force_desc:0 "A carrier task force can sail the world and strike anywhere. We will organize our carriers into such forces."
 rpx_navy3_naval_air_arm:0 "Naval Air Arm"
 rpx_navy3_naval_air_arm_desc:0 "Naval aviation is a separate and proud service. We will build a strong naval air arm."
 rpx_navy3_naval_bomber_design:0 "Naval Bomber Design"
 rpx_navy3_naval_bomber_design_desc:0 "Aircraft that strike at ships must be designed for the sea. We will develop dedicated naval bombers."
 rpx_navy3_seaplane_tenders:0 "Seaplane Tenders"
 rpx_navy3_seaplane_tenders_desc:0 "Seaplanes extend the eyes of the fleet. We will build tenders to carry them across the oceans."
 rpx_navy3_naval_air_doctrine:0 "Naval Air Doctrine"
 rpx_navy3_naval_air_doctrine_desc:0 "We will develop the doctrine of naval air power to its fullest extent. The sea will be ruled from the sky."
 rpx_navy3_air_wing_training:0 "Air Wing Training"
 rpx_navy3_air_wing_training_desc:0 "Well-trained air wings strike hard and survive. We will bring our naval air wings to the highest standard."
 rpx_navy3_naval_bomber_production:0 "Naval Bomber Production"
 rpx_navy3_naval_bomber_production_desc:0 "Naval bombers must be produced in strength. We will expand their production to equip our carriers and bases."
 rpx_navy3_amphibious_command:0 "Amphibious Command"
 rpx_navy3_amphibious_command_desc:0 "Landings from the sea can turn an enemy's flank. We will establish a command for amphibious operations."
 rpx_navy3_projection:0 "Naval Projection"
 rpx_navy3_projection_desc:0 "Our fleet must be able to strike anywhere in the world. We will develop the power of naval projection."
 rpx_navy3_base_network:0 "Base Network"
 rpx_navy3_base_network_desc:0 "A fleet needs bases across the oceans. We will build a worldwide network of naval bases."
 rpx_navy3_fuel_efficiency:0 "Fuel Efficiency"
 rpx_navy3_fuel_efficiency_desc:0 "Every ton of fuel saved is a ton available to the fleet. We will improve the fuel efficiency of our ships."
 rpx_navy3_convoy_protection:0 "Convoy Protection"
 rpx_navy3_convoy_protection_desc:0 "The convoy is the lifeline of a nation at war. We will build the forces to protect our shipping."
 rpx_navy3_amphibious_support:0 "Amphibious Support"
 rpx_navy3_amphibious_support_desc:0 "The fleet's guns and aircraft can pave the way for a landing. We will develop amphibious support."
 rpx_navy3_naval_war_college:0 "Naval War College"
 rpx_navy3_naval_war_college_desc:0 "Admirals are made in the war college. We will establish the institutions to train our naval commanders."
 rpx_navy3_doctrine_research:0 "Doctrine Research"
 rpx_navy3_doctrine_research_desc:0 "Victory at sea belongs to those who study it. We will fund research into naval doctrine."
 rpx_navy3_intelligence:0 "Naval Intelligence"
 rpx_navy3_intelligence_desc:0 "Knowledge of the enemy fleet is the first weapon of the admiral. We will build a powerful naval intelligence service."
 rpx_navy3_combined_arms:0 "Combined Arms"
 rpx_navy3_combined_arms_desc:0 "Carriers, battleships, cruisers, screens and submarines must fight as one. We will perfect the combined fleet battle."
 rpx_navy3_navy_morale:0 "Navy Morale"
 rpx_navy3_navy_morale_desc:0 "A fleet fights with its spirit as much as its steel. We will keep the morale of our navy high."
 rpx_navy3_critical_hits:0 "Critical Hits"
 rpx_navy3_critical_hits_desc:0 "One well-placed hit can sink the greatest ship. We will train our gunners and torpedo men to strike the vital spot."
 rpx_navy3_ship_speed_program:0 "Ship Speed Program"
 rpx_navy3_ship_speed_program_desc:0 "Speed is a weapon in itself. We will build faster hulls and engines for our ships."
 rpx_navy3_shipbuilding_network:0 "Shipbuilding Network"
 rpx_navy3_shipbuilding_network_desc:0 "A network of shipyards can build a great fleet quickly. We will link our yards into an efficient whole."
 rpx_navy3_advanced_shipbuilding:0 "Advanced Shipbuilding"
 rpx_navy3_advanced_shipbuilding_desc:0 "Advanced techniques build better ships faster. We will master the latest in shipbuilding."
 rpx_navy3_officer_corps:0 "Naval Officer Corps"
 rpx_navy3_officer_corps_desc:0 "Officers are the brain of the fleet. We will train a professional naval officer corps."
 rpx_navy3_leadership_training:0 "Leadership Training"
 rpx_navy3_leadership_training_desc:0 "A ship's captain can make or break her crew. We will train our naval leaders to the highest standard."
 rpx_navy3_carrier_strike_group:0 "Carrier Strike Group"
 rpx_navy3_carrier_strike_group_desc:0 "A concentrated carrier strike group is the deadliest weapon at sea. We will build and organize one."
 rpx_navy3_naval_air_supremacy:0 "Naval Air Supremacy"
 rpx_navy3_naval_air_supremacy_desc:0 "No navy will match our naval air power. We will achieve supremacy over the seas from the sky."
 rpx_navy3_global_fleet:0 "Global Fleet"
 rpx_navy3_global_fleet_desc:0 "Our fleet will sail every ocean and guard every sea lane. We will build a truly global navy."
 rpx_navy3_light_ship_program:0 "Light Ship Program"
 rpx_navy3_light_ship_program_desc:0 "The light forces guard the fleet and fight the long war of the seas. We will build them in numbers."
 rpx_navy3_light_cruiser_squadrons:0 "Light Cruiser Squadrons"
 rpx_navy3_light_cruiser_squadrons_desc:0 "Light cruisers screen the fleet and raid the enemy's commerce. We will raise their squadrons."
 rpx_navy3_destroyer_screen:0 "Destroyer Screen"
 rpx_navy3_destroyer_screen_desc:0 "Destroyers form the screen that guards the battle fleet. We will build our destroyer screen."
 rpx_navy3_torpedo_craft:0 "Torpedo Craft"
 rpx_navy3_torpedo_craft_desc:0 "Fast torpedo craft can strike at giants. We will develop motor torpedo boats and their tactics."
 rpx_navy3_convoy_escort:0 "Convoy Escort"
 rpx_navy3_convoy_escort_desc:0 "Escorts guard the convoys against the wolf packs. We will build the escort forces of the sea lanes."
 rpx_navy3_anti_submarine_warfare:0 "Anti-Submarine Warfare"
 rpx_navy3_anti_submarine_warfare_desc:0 "The submarine is the hidden assassin of the seas. We will develop the means to hunt and destroy it."
 rpx_navy3_coastal_defense:0 "Coastal Defense"
 rpx_navy3_coastal_defense_desc:0 "Our coasts must be guarded against invasion and bombardment. We will build our coastal defense forces."
 rpx_navy3_screen_flotillas:0 "Screen Flotillas"
 rpx_navy3_screen_flotillas_desc:0 "Screen flotillas will guard the battle fleet and its convoys. We will raise them in strength."
 rpx_navy3_screen_capstone:0 "Screen Mastery"
 rpx_navy3_screen_capstone_desc:0 "Our light forces will be without equal. We will achieve mastery of the screening and escort battle."
 rpx_navy3_submarine_arm:0 "Submarine Arm"
 rpx_navy3_submarine_arm_desc:0 "The submarine is the weapon of the weak and the nightmare of the strong. We will build a submarine arm without equal."
 rpx_navy3_submarine_design:0 "Submarine Design"
 rpx_navy3_submarine_design_desc:0 "We will develop a new generation of submarines able to strike at the enemy's commerce and warships."
 rpx_navy3_submarine_doctrine:0 "Submarine Doctrine"
 rpx_navy3_submarine_doctrine_desc:0 "Submarines win their wars in packs. We will develop the doctrine of the submarine campaign."
 rpx_navy3_submarine_stealth:0 "Submarine Stealth"
 rpx_navy3_submarine_stealth_desc:0 "The submarine lives by being unseen. We will make our boats quieter and harder to detect."
 rpx_navy3_submarine_torpedo:0 "Submarine Torpedoes"
 rpx_navy3_submarine_torpedo_desc:0 "The torpedo is the submarine's only argument. We will develop the most deadly torpedoes in the world."
 rpx_navy3_fleet_submarine:0 "Fleet Submarines"
 rpx_navy3_fleet_submarine_desc:0 "Fleet submarines can range across the oceans with the fleet. We will build large, fast, long-ranged boats."
 rpx_navy3_cruiser_submarine:0 "Cruiser Submarines"
 rpx_navy3_cruiser_submarine_desc:0 "Armed like cruisers, these submarines can fight as well as hide. We will develop large cruiser submarines."
 rpx_navy3_midget_submarine:0 "Midget Submarines"
 rpx_navy3_midget_submarine_desc:0 "Small craft can penetrate where warships cannot. We will develop midget submarines for special operations."
 rpx_navy3_submarine_logistics:0 "Submarine Logistics"
 rpx_navy3_submarine_logistics_desc:0 "Submarines must be supplied far from home. We will build the logistics that keep our boats at sea."
 rpx_navy3_submarine_capstone:0 "Submarine Mastery"
 rpx_navy3_submarine_capstone_desc:0 "We will master the submarine as the weapon of the decisive commerce war. No convoy will be safe from us."
 rpx_navy3_capital_ship_program:0 "Capital Ship Program"
 rpx_navy3_capital_ship_program_desc:0 "The capital ship remains the pride of the fleet. We will build a new generation of mighty warships."
 rpx_navy3_battlecruiser_program:0 "Battlecruiser Program"
 rpx_navy3_battlecruiser_program_desc:0 "The battlecruiser outruns what it cannot outfight. We will build fast, heavily armed battlecruisers."
 rpx_navy3_heavy_cruiser_program:0 "Heavy Cruiser Program"
 rpx_navy3_heavy_cruiser_program_desc:0 "The heavy cruiser is the hunter of the sea lanes. We will build them in numbers."
 rpx_navy3_capital_armor:0 "Capital Ship Armor"
 rpx_navy3_capital_armor_desc:0 "A capital ship must be a fortress afloat. We will develop ever thicker and better arranged armor."
 rpx_navy3_capital_guns:0 "Capital Guns"
 rpx_navy3_capital_guns_desc:0 "The capital ship's argument is the big gun. We will develop heavier and more accurate main batteries."
 rpx_navy3_capital_doctrine:0 "Capital Ship Doctrine"
 rpx_navy3_capital_doctrine_desc:0 "The big gun still commands the sea. We will develop the doctrine of capital ship warfare."
 rpx_navy3_super_heavy_ships:0 "Super-Heavy Ships"
 rpx_navy3_super_heavy_ships_desc:0 "We will build ships that dwarf all rivals. Our super-heavy capital ships will be the pride of the fleet."
 rpx_navy3_fast_capital_ships:0 "Fast Capital Ships"
 rpx_navy3_fast_capital_ships_desc:0 "Speed lets the capital ship choose its battles. We will build fast capital ships able to run down any foe."
 rpx_navy3_capital_fire_control:0 "Capital Fire Control"
 rpx_navy3_capital_fire_control_desc:0 "Accurate fire control multiplies the power of the big gun. We will perfect the art of long-range gunnery."
 rpx_navy3_capital_capstone:0 "Capital Ship Mastery"
 rpx_navy3_capital_capstone_desc:0 "Our capital ships will rule the seas. We will achieve mastery of the great battle of the fleets."
 rpx_navy3_total_fleet:0 "Total Fleet"
 rpx_navy3_total_fleet_desc:0 "Every type of warship, in every necessary number, will fly our flag. We will build a total fleet without equal."
 rpx_pol1_government_reform:0 "Government Reform"
 rpx_pol1_government_reform_desc:0 "The state is the instrument by which a nation lives or dies. We will reform our government to meet the challenges of the modern age."
 rpx_pol1_ideology_pivot:0 "Ideology Pivot"
 rpx_pol1_ideology_pivot_desc:0 "The hour has come to choose the road our nation will walk. We will pivot our politics toward a chosen ideology."
 rpx_pol1_mod_roots:0 "Moderate Roots"
 rpx_pol1_mod_roots_desc:0 "Moderation is the wisdom of the ages. We will build our politics on the broad and stable ground of the political center."
 rpx_pol1_dem_roots:0 "Democratic Roots"
 rpx_pol1_dem_roots_desc:0 "Government by the people, for the people. We will deepen our democratic institutions and traditions."
 rpx_pol1_dem_a1:0 "Parliamentary Reform"
 rpx_pol1_dem_a1_desc:0 "A parliament that represents the people commands their loyalty. We will reform our parliamentary institutions."
 rpx_pol1_dem_a2:0 "Free Press"
 rpx_pol1_dem_a2_desc:0 "A free press is the guardian of democracy. We will defend the freedom of the press against all who would silence it."
 rpx_pol1_dem_a3:0 "Civil Liberties"
 rpx_pol1_dem_a3_desc:0 "The liberty of the citizen is the foundation of the democratic state. We will protect and expand our civil liberties."
 rpx_pol1_dem_b1:0 "Coalition Politics"
 rpx_pol1_dem_b1_desc:0 "Democracy is the art of compromise. We will build stable coalitions that can govern effectively."
 rpx_pol1_dem_b2:0 "Civic Institutions"
 rpx_pol1_dem_b2_desc:0 "A healthy democracy rests on its civic institutions. We will strengthen the associations of civil society."
 rpx_pol1_dem_b3:0 "Constitutional Rights"
 rpx_pol1_dem_b3_desc:0 "The rights of the citizen must be written and defended. We will enshrine our constitutional rights."
 rpx_pol1_dem_cap:0 "Democratic Supremacy"
 rpx_pol1_dem_cap_desc:0 "Our democracy will be a model for the world. We will achieve supremacy of the democratic ideal."
 rpx_pol1_neu_roots:0 "Neutralist Roots"
 rpx_pol1_neu_roots_desc:0 "We will keep our nation out of the quarrels of the great powers. Neutrality is our shield."
 rpx_pol1_neu_a1:0 "National Stability"
 rpx_pol1_neu_a1_desc:0 "Stability at home is the condition of safety abroad. We will keep our nation calm and united."
 rpx_pol1_neu_a2:0 "Domestic Order"
 rpx_pol1_neu_a2_desc:0 "Order is the first duty of the state. We will maintain firm domestic order."
 rpx_pol1_neu_a3:0 "Peace Policy"
 rpx_pol1_neu_a3_desc:0 "Peace is the greatest good. We will pursue a policy that keeps our nation out of war."
 rpx_pol1_neu_b1:0 "Non-Alignment"
 rpx_pol1_neu_b1_desc:0 "We will belong to no alliance and no bloc. Our nation will stand apart from the conflicts of the powers."
 rpx_pol1_neu_b2:0 "Diplomacy of Balance"
 rpx_pol1_neu_b2_desc:0 "We will balance between the powers and profit from their rivalry. Our diplomacy will keep us safe."
 rpx_pol1_neu_b3:0 "National Unity"
 rpx_pol1_neu_b3_desc:0 "United, the nation cannot be broken. We will foster the unity that is our greatest defense."
 rpx_pol1_neu_cap:0 "Neutral Supremacy"
 rpx_pol1_neu_cap_desc:0 "Our neutrality will be total and respected by all. We will master the art of standing apart."
 rpx_pol1_auth_roots:0 "Authoritarian Roots"
 rpx_pol1_auth_roots_desc:0 "Strong hands are needed in dangerous times. We will strengthen the authority of the state."
 rpx_pol1_fas_roots:0 "Fascist Roots"
 rpx_pol1_fas_roots_desc:0 "The nation above all, the individual in service of the state. We will embrace the fascist ideal."
 rpx_pol1_fas_a1:0 "Party Discipline"
 rpx_pol1_fas_a1_desc:0 "The party is the sword and shield of the nation. We will forge it into a single disciplined instrument."
 rpx_pol1_fas_a2:0 "Corporatist State"
 rpx_pol1_fas_a2_desc:0 "Capital and labor will serve the nation together. We will organize the state on corporatist lines."
 rpx_pol1_fas_a3:0 "Youth Movement"
 rpx_pol1_fas_a3_desc:0 "The youth are the future of the nation. We will raise them in the service of the state."
 rpx_pol1_fas_b1:0 "Strong Leadership"
 rpx_pol1_fas_b1_desc:0 "A nation needs a leader of iron will. We will concentrate leadership in a single strong hand."
 rpx_pol1_fas_b2:0 "State Propaganda"
 rpx_pol1_fas_b2_desc:0 "The minds of the people belong to the nation. We will use propaganda to forge a single national will."
 rpx_pol1_fas_b3:0 "Militarized Society"
 rpx_pol1_fas_b3_desc:0 "The nation will be a camp of soldiers. We will militarize our society for the coming struggle."
 rpx_pol1_fas_cap:0 "Fascist Supremacy"
 rpx_pol1_fas_cap_desc:0 "The fascist state will be all-powerful. We will achieve supremacy of the party and the nation."
 rpx_pol1_com_roots:0 "Communist Roots"
 rpx_pol1_com_roots_desc:0 "The workers and peasants will inherit the nation. We will build our politics on the communist ideal."
 rpx_pol1_com_a1:0 "Party Congress"
 rpx_pol1_com_a1_desc:0 "The party is the vanguard of the working class. We will make its congress the highest body of the state."
 rpx_pol1_com_a2:0 "State Planning"
 rpx_pol1_com_a2_desc:0 "The economy will serve the people, not the few. We will introduce state planning."
 rpx_pol1_com_a3:0 "Worker Councils"
 rpx_pol1_com_a3_desc:0 "The workers will govern their own workplaces. We will build councils of workers and peasants."
 rpx_pol1_com_b1:0 "Collective Leadership"
 rpx_pol1_com_b1_desc:0 "The party will lead as one, not as one man. We will practice collective leadership."
 rpx_pol1_com_b2:0 "Proletarian Culture"
 rpx_pol1_com_b2_desc:0 "Art and culture belong to the people. We will build a proletarian culture."
 rpx_pol1_com_b3:0 "Class Struggle"
 rpx_pol1_com_b3_desc:0 "The class struggle sharpens the spirit of the nation. We will lead the workers in their struggle."
 rpx_pol1_com_cap:0 "Communist Supremacy"
 rpx_pol1_com_cap_desc:0 "The revolution will be completed. We will achieve supremacy of the communist state."
 rpx_pol1_apparatus_roots:0 "State Apparatus"
 rpx_pol1_apparatus_roots_desc:0 "The state stands on its administration. We will build a powerful and loyal state apparatus."
 rpx_pol1_apparatus_a1:0 "Administrative Reform"
 rpx_pol1_apparatus_a1_desc:0 "A well-run state is a strong state. We will reform and modernize our administration."
 rpx_pol1_apparatus_b1:0 "Secret Police"
 rpx_pol1_apparatus_b1_desc:0 "The enemies of the state hide in the shadows. We will build a secret police to find them."
 rpx_pol1_apparatus_cap:0 "Apparatus Supremacy"
 rpx_pol1_apparatus_cap_desc:0 "The state will see all and know all. We will achieve supremacy of the state apparatus."
 rpx_pol1_unity_roots:0 "National Unity"
 rpx_pol1_unity_roots_desc:0 "United we stand, divided we fall. We will build the unity of the nation above all divisions."
 rpx_pol1_unity_a1:0 "Patriotic Education"
 rpx_pol1_unity_a1_desc:0 "The love of country is learned in the school. We will teach patriotism to our youth."
 rpx_pol1_unity_b1:0 "Cultural Renewal"
 rpx_pol1_unity_b1_desc:0 "Our culture is the soul of the nation. We will renew and strengthen our national culture."
 rpx_pol1_unity_cap:0 "Total Unity"
 rpx_pol1_unity_cap_desc:0 "The nation will be one in heart and mind. We will achieve total unity."
 rpx_pol2_social_reform:0 "Social Reform"
 rpx_pol2_social_reform_desc:0 "A nation is strong when its people are cared for. We will reform our society to give every citizen a stake in the nation."
 rpx_pol2_ideology_pivot:0 "Ideology Pivot"
 rpx_pol2_ideology_pivot_desc:0 "The hour has come to choose the road our nation will walk. We will pivot our politics toward a chosen ideology."
 rpx_pol2_mod_roots:0 "Moderate Roots"
 rpx_pol2_mod_roots_desc:0 "Moderation is the wisdom of the ages. We will build our politics on the broad and stable ground of the political center."
 rpx_pol2_dem_roots:0 "Democratic Roots"
 rpx_pol2_dem_roots_desc:0 "Government by the people, for the people. We will deepen our democratic institutions and traditions."
 rpx_pol2_dem_a1:0 "Social Democracy"
 rpx_pol2_dem_a1_desc:0 "Democracy and social justice belong together. We will build a social democracy."
 rpx_pol2_dem_a2:0 "Welfare Programs"
 rpx_pol2_dem_a2_desc:0 "The state will care for those who cannot care for themselves. We will build a comprehensive welfare system."
 rpx_pol2_dem_a3:0 "Labor Rights"
 rpx_pol2_dem_a3_desc:0 "The worker is the foundation of the nation. We will protect and expand the rights of labor."
 rpx_pol2_dem_b1:0 "Education Reform"
 rpx_pol2_dem_b1_desc:0 "An educated people is a free people. We will reform and expand our schools."
 rpx_pol2_dem_b2:0 "Healthcare Expansion"
 rpx_pol2_dem_b2_desc:0 "Health is the first wealth. We will expand healthcare to all our citizens."
 rpx_pol2_dem_b3:0 "Equal Rights"
 rpx_pol2_dem_b3_desc:0 "All citizens are equal before the law. We will extend equal rights to all."
 rpx_pol2_dem_cap:0 "Democratic Supremacy"
 rpx_pol2_dem_cap_desc:0 "Our democracy will be a model for the world. We will achieve supremacy of the democratic ideal."
 rpx_pol2_neu_roots:0 "Neutralist Roots"
 rpx_pol2_neu_roots_desc:0 "We will keep our nation out of the quarrels of the great powers. Neutrality is our shield."
 rpx_pol2_neu_a1:0 "Social Stability"
 rpx_pol2_neu_a1_desc:0 "A stable society is the foundation of peace. We will keep our nation calm and united."
 rpx_pol2_neu_a2:0 "Rural Welfare"
 rpx_pol2_neu_a2_desc:0 "The countryside is the heart of the nation. We will care for our rural communities."
 rpx_pol2_neu_a3:0 "Community Programs"
 rpx_pol2_neu_a3_desc:0 "Strong communities make a strong nation. We will support the life of our local communities."
 rpx_pol2_neu_b1:0 "Pragmatic Reform"
 rpx_pol2_neu_b1_desc:0 "Reform by prudence, not by passion. We will improve our society step by step."
 rpx_pol2_neu_b2:0 "Gradual Change"
 rpx_pol2_neu_b2_desc:0 "Change that comes slowly is change that lasts. We will pursue gradual improvement."
 rpx_pol2_neu_b3:0 "National Concord"
 rpx_pol2_neu_b3_desc:0 "Harmony between classes is the strength of the nation. We will foster national concord."
 rpx_pol2_neu_cap:0 "Neutral Supremacy"
 rpx_pol2_neu_cap_desc:0 "Our neutrality will be total and respected by all. We will master the art of standing apart."
 rpx_pol2_auth_roots:0 "Authoritarian Roots"
 rpx_pol2_auth_roots_desc:0 "Strong hands are needed in dangerous times. We will strengthen the authority of the state."
 rpx_pol2_fas_roots:0 "Fascist Roots"
 rpx_pol2_fas_roots_desc:0 "The nation above all, the individual in service of the state. We will embrace the fascist ideal."
 rpx_pol2_fas_a1:0 "National Service"
 rpx_pol2_fas_a1_desc:0 "Every citizen will serve the nation. We will institute a system of national service."
 rpx_pol2_fas_a2:0 "Population Policy"
 rpx_pol2_fas_a2_desc:0 "The strength of a nation is its people. We will pursue a policy of population growth."
 rpx_pol2_fas_a3:0 "Fascist Youth"
 rpx_pol2_fas_a3_desc:0 "The youth will be forged in the service of the nation. We will build the fascist youth movement."
 rpx_pol2_fas_b1:0 "Labor Corps"
 rpx_pol2_fas_b1_desc:0 "The labor of the nation will be organized for its greatness. We will build a national labor corps."
 rpx_pol2_fas_b2:0 "Social Control"
 rpx_pol2_fas_b2_desc:0 "Society will be disciplined in the service of the state. We will bring our society under firm control."
 rpx_pol2_fas_b3:0 "Fascist Society"
 rpx_pol2_fas_b3_desc:0 "The whole of society will be remade in the fascist image. We will build a truly fascist society."
 rpx_pol2_fas_cap:0 "Fascist Supremacy"
 rpx_pol2_fas_cap_desc:0 "The fascist state will be all-powerful. We will achieve supremacy of the party and the nation."
 rpx_pol2_com_roots:0 "Communist Roots"
 rpx_pol2_com_roots_desc:0 "The workers and peasants will inherit the nation. We will build our politics on the communist ideal."
 rpx_pol2_com_a1:0 "Workers' Democracy"
 rpx_pol2_com_a1_desc:0 "The people will govern themselves through their councils. We will build a workers' democracy."
 rpx_pol2_com_a2:0 "Collective Farms"
 rpx_pol2_com_a2_desc:0 "The land belongs to those who work it. We will organize collective farms."
 rpx_pol2_com_a3:0 "Factory Committees"
 rpx_pol2_com_a3_desc:0 "The workers will direct their own labor. We will establish factory committees."
 rpx_pol2_com_b1:0 "Socialized Medicine"
 rpx_pol2_com_b1_desc:0 "Health care is a right of the people. We will socialize our medical services."
 rpx_pol2_com_b2:0 "Public Housing"
 rpx_pol2_com_b2_desc:0 "Every worker deserves a roof. We will build public housing for the people."
 rpx_pol2_com_b3:0 "Proletarian Unity"
 rpx_pol2_com_b3_desc:0 "The workers of the nation stand together. We will build proletarian unity."
 rpx_pol2_com_cap:0 "Communist Supremacy"
 rpx_pol2_com_cap_desc:0 "The revolution will be completed. We will achieve supremacy of the communist state."
 rpx_pol2_occupation_roots:0 "Occupation Policy"
 rpx_pol2_occupation_roots_desc:0 "The lands we hold must be governed well. We will develop a just and efficient occupation policy."
 rpx_pol2_occupation_a1:0 "Efficient Administration"
 rpx_pol2_occupation_a1_desc:0 "A well-administered occupation costs little and gains much. We will govern the occupied lands efficiently."
 rpx_pol2_occupation_b1:0 "Compliance Program"
 rpx_pol2_occupation_b1_desc:0 "The willing cooperation of the conquered is worth an army. We will win compliance through good governance."
 rpx_pol2_occupation_cap:0 "Total Occupation Control"
 rpx_pol2_occupation_cap_desc:0 "Our rule over the occupied lands will be complete and unchallenged. We will achieve total control."
 rpx_pol2_mobilization_roots:0 "Mobilization"
 rpx_pol2_mobilization_roots_desc:0 "The strength of the nation must be organized for its defense. We will mobilize our people."
 rpx_pol2_mobilization_a1:0 "Labor Mobilization"
 rpx_pol2_mobilization_a1_desc:0 "Every worker will serve the nation. We will mobilize our labor force."
 rpx_pol2_mobilization_b1:0 "National Effort"
 rpx_pol2_mobilization_b1_desc:0 "The entire nation will work as one. We will organize a national effort."
 rpx_pol2_mobilization_cap:0 "Total Mobilization"
 rpx_pol2_mobilization_cap_desc:0 "Every citizen, every worker and every resource will serve the nation. We will achieve total mobilization."
 rpx_pol3_foreign_policy:0 "Foreign Policy"
 rpx_pol3_foreign_policy_desc:0 "A nation cannot live alone. We will chart our course among the powers and peoples of the world."
 rpx_pol3_ideology_pivot:0 "Ideology Pivot"
 rpx_pol3_ideology_pivot_desc:0 "The hour has come to choose the road our nation will walk. We will pivot our politics toward a chosen ideology."
 rpx_pol3_mod_roots:0 "Moderate Roots"
 rpx_pol3_mod_roots_desc:0 "Moderation is the wisdom of the ages. We will build our politics on the broad and stable ground of the political center."
 rpx_pol3_dem_roots:0 "Democratic Roots"
 rpx_pol3_dem_roots_desc:0 "Government by the people, for the people. We will deepen our democratic institutions and traditions."
 rpx_pol3_dem_a1:0 "Alliance of Democracies"
 rpx_pol3_dem_a1_desc:0 "Democracies must stand together. We will seek the friendship and alliance of the democratic powers."
 rpx_pol3_dem_a2:0 "Diplomatic Offensive"
 rpx_pol3_dem_a2_desc:0 "Our diplomats will carry our cause to every capital. We will launch a diplomatic offensive."
 rpx_pol3_dem_a3:0 "Global Cooperation"
 rpx_pol3_dem_a3_desc:0 "Nations working together can keep the peace. We will pursue global cooperation."
 rpx_pol3_dem_b1:0 "Collective Security"
 rpx_pol3_dem_b1_desc:0 "The security of all is the security of each. We will build a system of collective security."
 rpx_pol3_dem_b2:0 "Free Trade Agreements"
 rpx_pol3_dem_b2_desc:0 "Trade binds nations in peace. We will negotiate free trade agreements."
 rpx_pol3_dem_b3:0 "Open Diplomacy"
 rpx_pol3_dem_b3_desc:0 "Diplomacy must be honest and open. We will conduct our foreign policy in the light."
 rpx_pol3_dem_cap:0 "Democratic Supremacy"
 rpx_pol3_dem_cap_desc:0 "Our democracy will be a model for the world. We will achieve supremacy of the democratic ideal."
 rpx_pol3_neu_roots:0 "Neutralist Roots"
 rpx_pol3_neu_roots_desc:0 "We will keep our nation out of the quarrels of the great powers. Neutrality is our shield."
 rpx_pol3_neu_a1:0 "Armed Neutrality"
 rpx_pol3_neu_a1_desc:0 "Neutrality must be defended. We will maintain the strength to keep our neutrality respected."
 rpx_pol3_neu_a2:0 "Non-Intervention"
 rpx_pol3_neu_a2_desc:0 "We will not intervene in the affairs of others. Let other nations settle their own quarrels."
 rpx_pol3_neu_a3:0 "Trade of Necessity"
 rpx_pol3_neu_a3_desc:0 "Even a neutral nation must trade. We will maintain our commerce with all who will trade with us."
 rpx_pol3_neu_b1:0 "Diplomatic Balance"
 rpx_pol3_neu_b1_desc:0 "We will balance between the powers and profit from their rivalry. Our diplomacy will keep us safe."
 rpx_pol3_neu_b2:0 "Good Offices"
 rpx_pol3_neu_b2_desc:0 "The neutral can be the peacemaker. We will offer our good offices to the quarreling powers."
 rpx_pol3_neu_b3:0 "National Sovereignty"
 rpx_pol3_neu_b3_desc:0 "Our nation will bow to no foreign power. We will defend our sovereignty absolutely."
 rpx_pol3_neu_cap:0 "Neutral Supremacy"
 rpx_pol3_neu_cap_desc:0 "Our neutrality will be total and respected by all. We will master the art of standing apart."
 rpx_pol3_auth_roots:0 "Authoritarian Roots"
 rpx_pol3_auth_roots_desc:0 "Strong hands are needed in dangerous times. We will strengthen the authority of the state."
 rpx_pol3_fas_roots:0 "Fascist Roots"
 rpx_pol3_fas_roots_desc:0 "The nation above all, the individual in service of the state. We will embrace the fascist ideal."
 rpx_pol3_fas_a1:0 "Aggressive Claims"
 rpx_pol3_fas_a1_desc:0 "Our nation will claim its rightful place. We will press our claims against the great powers."
 rpx_pol3_fas_a2:0 "Axis Solidarity"
 rpx_pol3_fas_a2_desc:0 "The fascist powers will stand together. We will build solidarity with our ideological kin."
 rpx_pol3_fas_a3:0 "Expansionist Doctrine"
 rpx_pol3_fas_a3_desc:0 "Living space is the destiny of a great nation. We will develop an expansionist doctrine."
 rpx_pol3_fas_b1:0 "Puppet States"
 rpx_pol3_fas_b1_desc:0 "Weaker states will serve our cause. We will bring the lands of our neighbors under our influence."
 rpx_pol3_fas_b2:0 "Territorial Ambition"
 rpx_pol3_fas_b2_desc:0 "Our nation will grow or die. We will pursue our territorial ambitions."
 rpx_pol3_fas_b3:0 "Total Nationalism"
 rpx_pol3_fas_b3_desc:0 "Our nation above all nations. We will pursue a policy of total nationalism."
 rpx_pol3_fas_cap:0 "Fascist Supremacy"
 rpx_pol3_fas_cap_desc:0 "The fascist state will be all-powerful. We will achieve supremacy of the party and the nation."
 rpx_pol3_com_roots:0 "Communist Roots"
 rpx_pol3_com_roots_desc:0 "The workers and peasants will inherit the nation. We will build our politics on the communist ideal."
 rpx_pol3_com_a1:0 "Comintern Solidarity"
 rpx_pol3_com_a1_desc:0 "Workers of the world, unite. We will build solidarity with the communist powers."
 rpx_pol3_com_a2:0 "Revolutionary Export"
 rpx_pol3_com_a2_desc:0 "The revolution does not stop at our borders. We will support revolution abroad."
 rpx_pol3_com_a3:0 "World Revolution"
 rpx_pol3_com_a3_desc:0 "The final victory of the workers will come. We will work for the world revolution."
 rpx_pol3_com_b1:0 "Anti-Imperialist Front"
 rpx_pol3_com_b1_desc:0 "The peoples of the world will throw off their chains. We will lead an anti-imperialist front."
 rpx_pol3_com_b2:0 "International Proletariat"
 rpx_pol3_com_b2_desc:0 "The workers of every nation are our brothers. We will build ties with the international proletariat."
 rpx_pol3_com_b3:0 "Class Struggle Abroad"
 rpx_pol3_com_b3_desc:0 "The class war is waged across borders. We will advance the struggle abroad."
 rpx_pol3_com_cap:0 "Communist Supremacy"
 rpx_pol3_com_cap_desc:0 "The revolution will be completed. We will achieve supremacy of the communist state."
 rpx_pol3_intel_roots:0 "Intelligence Services"
 rpx_pol3_intel_roots_desc:0 "The nation that knows all cannot be surprised. We will build a powerful intelligence service."
 rpx_pol3_intel_a1:0 "Foreign Intelligence"
 rpx_pol3_intel_a1_desc:0 "The plans of our enemies must be known to us. We will build a foreign intelligence network."
 rpx_pol3_intel_b1:0 "Espionage Network"
 rpx_pol3_intel_b1_desc:0 "Agents in every capital will serve the nation. We will build a worldwide espionage network."
 rpx_pol3_intel_cap:0 "Total Intelligence Dominance"
 rpx_pol3_intel_cap_desc:0 "No secret will be kept from us. We will achieve total dominance in intelligence."
 rpx_pol3_subjects_roots:0 "Subject Relations"
 rpx_pol3_subjects_roots_desc:0 "The nations that look to us must be governed well. We will manage our relations with our subjects."
 rpx_pol3_subjects_a1:0 "Subject Integration"
 rpx_pol3_subjects_a1_desc:0 "Our subjects will be bound closely to us. We will integrate them into our order."
 rpx_pol3_subjects_b1:0 "Sphere of Influence"
 rpx_pol3_subjects_b1_desc:0 "The lands that look to us will remain loyal. We will build our sphere of influence."
 rpx_pol3_subjects_cap:0 "Total Subject Control"
 rpx_pol3_subjects_cap_desc:0 "Our word will be law across our sphere. We will achieve total control over our subjects."
