l_english:
 rpx_air_ace_training: "Ace Training Program"
 rpx_air_ace_training_desc: "Our finest pilots are given every chance to distinguish themselves. A well-managed ace program raises the skill of our veteran airmen and turns gifted newcomers into the aces of tomorrow."
 rpx_air_air_dominance: "Air Dominance Doctrine"
 rpx_air_air_dominance_desc: "Total mastery of the skies is the foundation of modern warfare. Our air force is drilled to win the battle for air superiority before the ground war even begins."
 rpx_air_air_superiority: "Air Superiority"
 rpx_air_air_superiority_desc: "Control of the skies decides the fate of armies below. We invest in the training, tactics and technology needed to sweep enemy aircraft from the sky."
 rpx_air_all_weather: "All-Weather Operations"
 rpx_air_all_weather_desc: "War does not pause for rain or darkness. Our aircraft and aircrews are prepared to fly and fight around the clock, in every season and in every kind of weather."
 rpx_air_base_expansion: "Air Base Expansion"
 rpx_air_base_expansion_desc: "An air force is only as strong as the runways it operates from. We pour resources into building and expanding airfields to support ever larger air fleets."
 rpx_air_carrier_air_wings: "Carrier Air Wings"
 rpx_air_carrier_air_wings_desc: "The carrier is the heart of modern naval power. We train dedicated air wings whose fighters and dive bombers can strike the enemy from the decks of our fleet."
 rpx_air_cas_program: "Close Air Support Program"
 rpx_air_cas_program_desc: "Aircraft that can hit targets on the ground with precision are worth their weight in gold. We invest in dedicated ground attack aircraft to support our armies."
 rpx_air_close_air_support: "Close Air Support"
 rpx_air_close_air_support_desc: "Close cooperation between ground and air forces multiplies our combat power. Our pilots are trained to strike enemy formations wherever they stand."
 rpx_air_combat_training: "Air Combat Training"
 rpx_air_combat_training_desc: "Every hour spent in the air is an hour spent learning. Our pilots train relentlessly to gain the combat experience that decides battles over the front line."
 rpx_air_command_structure: "Air Command Structure"
 rpx_air_command_structure_desc: "A modern air force demands a modern command. Streamlined leadership and clear doctrine keep our air operations running at peak efficiency."
 rpx_air_dive_bombing: "Dive Bombing Techniques"
 rpx_air_dive_bombing_desc: "The steep dive turns a bomber into a precision weapon. Our dive bombers are built for agility and speed, delivering ordnance exactly where it is needed."
 rpx_air_doctrine_research: "Air Doctrine Research"
 rpx_air_doctrine_research_desc: "Doctrine wins wars as surely as factories do. We fund research into the aerial doctrines that will guide our air force for years to come."
 rpx_air_escort_doctrine: "Escort Doctrine"
 rpx_air_escort_doctrine_desc: "Bombers reach their targets only if their escorts reach theirs first. We develop the fighter escort tactics that protect our strategic bombing fleets."
 rpx_air_fighter_engine: "Fighter Engine Program"
 rpx_air_fighter_engine_desc: "Speed and range are the twin pillars of fighter design. We fund advanced engine programs to give our heavy fighters the reach they need to dominate the skies."
 rpx_air_fighter_program: "Fighter Program"
 rpx_air_fighter_program_desc: "The fighter is the guardian of our skies. We invest in the design, production and training that keep our fighter force one step ahead of the enemy."
 rpx_air_fuel_reserves: "Aviation Fuel Reserves"
 rpx_air_fuel_reserves_desc: "A grounded air force is no air force at all. We build the fuel reserves and supply lines that keep our aircraft flying even in the longest campaigns."
 rpx_air_ground_attack_aviation: "Ground Attack Aviation"
 rpx_air_ground_attack_aviation_desc: "Our ground attack aviation is a hammer that falls wherever the enemy is weakest. We refine the targeting and coordination that make it devastating."
 rpx_air_ground_support: "Ground Support"
 rpx_air_ground_support_desc: "When the army calls, the air force answers. Our pilots provide the close support that breaks enemy assaults and paves the way for our own offensives."
 rpx_air_heavy_bombers: "Heavy Bomber Program"
 rpx_air_heavy_bombers_desc: "Strategic bombing can break a nation's will to fight. We build the heavy bombers capable of carrying the war to the enemy's heartland."
 rpx_air_home_defence: "Home Defence"
 rpx_air_home_defence_desc: "Our homeland must be shielded from the raiders of the sky. We maintain dedicated interceptor forces to protect our cities and industry from attack."
 rpx_air_interceptor_focus: "Interceptor Program"
 rpx_air_interceptor_focus_desc: "Fast, agile and deadly, the interceptor is the first line of defence against hostile bombers. We develop the aircraft and tactics to make interception second nature."
 rpx_air_maintenance: "Airframe Maintenance"
 rpx_air_maintenance_desc: "Reliability keeps aircraft in the fight and crews alive. We invest in maintenance, spare parts and training to reduce accidents and keep wings at full strength."
 rpx_air_maritime_patrol: "Maritime Patrol Aviation"
 rpx_air_maritime_patrol_desc: "Long-range patrol aircraft are the eyes of the fleet. We build aircraft capable of hunting enemy shipping far beyond our shores."
 rpx_air_master_pilots: "Master Pilots"
 rpx_air_master_pilots_desc: "A small cadre of brilliant pilots can change the course of a war. We cultivate our best airmen into masters of their craft."
 rpx_air_naval_aviation: "Naval Aviation"
 rpx_air_naval_aviation_desc: "Aircraft and warships fight as one. We train our naval aviators to strike enemy fleets with the agility and precision that sea warfare demands."
 rpx_air_naval_strike: "Naval Strike Aviation"
 rpx_air_naval_strike_desc: "Torpedo bombers can turn the tide of a naval battle. We build and train the strike aircraft that threaten every enemy ship within range."
 rpx_air_officer_corps: "Air Officer Corps"
 rpx_air_officer_corps_desc: "A professional officer corps is the backbone of an effective air force. We expand our leadership and intelligence capabilities to support the air war."
 rpx_air_pilot_training: "Pilot Training"
 rpx_air_pilot_training_desc: "The quality of our pilots is the quality of our air force. We invest in training schools that turn raw recruits into skilled aviators."
 rpx_air_strategic_bombing: "Strategic Bombing Doctrine"
 rpx_air_strategic_bombing_desc: "Strategic bombing can break a nation's will to fight. We refine the doctrine and targeting that make our bomber fleets so devastating."
 rpx_air_strategic_recon: "Strategic Reconnaissance"
 rpx_air_strategic_recon_desc: "Knowledge is power, and the camera is its instrument. We develop long-range reconnaissance aircraft that map the enemy's every move."
 rpx_air_supreme_air_power: "Supreme Air Power"
 rpx_air_supreme_air_power_desc: "The skies belong to us. Our air force is unmatched in every measure of power, from the agility of our fighters to the reach of our bombers."
 rpx_air_tactical_bombers: "Tactical Bombers"
 rpx_air_tactical_bombers_desc: "Tactical bombers strike where the enemy concentrates his forces. We build aircraft that can support our armies with speed and devastating effect."
 rpx_air_total_air_dominance: "Total Air Dominance"
 rpx_air_total_air_dominance_desc: "We will not merely contest the skies, we will own them. Our air force is equipped and trained to establish total control of the air over the battlefield."
 rpx_air_veteran_wing: "Veteran Air Wings"
 rpx_air_veteran_wing_desc: "Experience is the most valuable asset a pilot has. We preserve the knowledge of our veteran wings so that it is never lost when they fall."
 rpx_air_volunteer_squadrons: "Volunteer Squadrons"
 rpx_air_volunteer_squadrons_desc: "Our airmen fight for more than borders. Volunteer squadrons carry our banner to foreign skies and win friends for our cause across the world."
 rpx_army_amphibious_warfare: "Amphibious Warfare"
 rpx_army_amphibious_warfare_desc: "The greatest obstacle to invasion is the sea itself. We train our forces to storm hostile shores and break through the beaches of the enemy."
 rpx_army_anti_air_focus: "Anti-Air Focus"
 rpx_army_anti_air_focus_desc: "The skies may be contested, but the ground is ours. We develop the anti-aircraft weapons that keep enemy aircraft at bay."
 rpx_army_anti_tank_focus: "Anti-Tank Focus"
 rpx_army_anti_tank_focus_desc: "The tank is the king of the modern battlefield. We arm our troops with the weapons and tactics needed to humble the armored legions of the enemy."
 rpx_army_armor_design_bureau: "Armor Design Bureau"
 rpx_army_armor_design_bureau_desc: "Better tanks are born in the drawing office. We establish a design bureau dedicated to producing cheaper, more effective armored fighting vehicles."
 rpx_army_armor_mass_production: "Armor Mass Production"
 rpx_army_armor_mass_production_desc: "Quantity has a quality all its own. We streamline tank production to field armored forces of truly overwhelming size."
 rpx_army_armor_mastery: "Armor Mastery"
 rpx_army_armor_mastery_desc: "We have mastered the art of the armored vehicle. Our tanks are heavier, more powerful and more dangerous than anything the enemy can field."
 rpx_army_armored_recon: "Armored Reconnaissance"
 rpx_army_armored_recon_desc: "Speed brings information, and information brings victory. Our armored reconnaissance units range far ahead to keep the enemy in our sights."
 rpx_army_artillery_command: "Artillery Command"
 rpx_army_artillery_command_desc: "Artillery is the god of war. We reorganize our artillery command to deliver more firepower on the enemy wherever he may be."
 rpx_army_artillery_mastery: "Artillery Mastery"
 rpx_army_artillery_mastery_desc: "The fury of our guns is unmatched. Our artillery has been perfected through relentless training and innovation."
 rpx_army_blitzkrieg_doctrine: "Blitzkrieg Doctrine"
 rpx_army_blitzkrieg_doctrine_desc: "Speed, surprise and concentrated force. We embrace the doctrine of lightning war, striking fast and deep to shatter the enemy's lines before he can react."
 rpx_army_breakthrough_doctrine: "Breakthrough Doctrine"
 rpx_army_breakthrough_doctrine_desc: "Wars are won by breaking through. Our doctrine concentrates every available resource into punching a hole in the enemy's defenses."
 rpx_army_breakthrough_training: "Breakthrough Training"
 rpx_army_breakthrough_training_desc: "Our troops train to smash through fortified positions. Relentless drill forges the offensive spirit that cracks even the strongest defenses."
 rpx_army_cavalry_mech: "Cavalry Mechanization"
 rpx_army_cavalry_mech_desc: "The horse is giving way to the engine. We mechanize our cavalry, trading hooves for horsepower and saddles for armor."
 rpx_army_central_command: "Central Command"
 rpx_army_central_command_desc: "A unified command can move armies as one. We centralize control of our armed forces to react faster and command with greater authority."
 rpx_army_cheap_equipment: "Cheap Equipment"
 rpx_army_cheap_equipment_desc: "Every rifle in the hands of a soldier is a blow against the enemy. We mass-produce simple, cheap equipment to arm our growing armies."
 rpx_army_combined_arms_doctrine: "Combined Arms Doctrine"
 rpx_army_combined_arms_doctrine_desc: "Infantry, armor and artillery must fight as one. Our combined arms doctrine binds them together into a single, irresistible force."
 rpx_army_combined_mech: "Combined Mechanization"
 rpx_army_combined_mech_desc: "The mechanized division is the spearhead of modern war. We improve the reliability of our vehicles to keep the mechanized columns rolling."
 rpx_army_command_structure: "Command Structure"
 rpx_army_command_structure_desc: "Clear orders win battles. We streamline our chain of command to plan faster and execute more effectively."
 rpx_army_defensive_spirit: "Defensive Spirit"
 rpx_army_defensive_spirit_desc: "We will hold every inch of our soil. Our forces are instilled with the spirit to defend their homeland against any invader."
 rpx_army_elite_combined_arms_doctrine: "Elite Combined Arms Doctrine"
 rpx_army_elite_combined_arms_doctrine_desc: "The pinnacle of modern warfare: elite units wielding every arm in perfect harmony. Our forces move, strike and defend as a single entity."
 rpx_army_elite_training: "Elite Training"
 rpx_army_elite_training_desc: "Our elite units are forged in the fires of the most demanding training. Their equipment is maintained to the highest standards of reliability."
 rpx_army_engineer_battalions: "Engineer Battalions"
 rpx_army_engineer_battalions_desc: "Engineers clear the way where others cannot pass. Our engineer battalions breach fortifications and keep supply lines flowing."
 rpx_army_entrenchment_training: "Entrenchment Training"
 rpx_army_entrenchment_training_desc: "The spade is a soldier's best friend. Our troops are trained to dig in and hold their ground under the heaviest fire."
 rpx_army_firepower_doctrine: "Firepower Doctrine"
 rpx_army_firepower_doctrine_desc: "Overwhelming firepower smashes any defense. Our doctrine concentrates artillery and rockets to destroy the enemy before the assault."
 rpx_army_fortification_focus: "Fortification Focus"
 rpx_army_fortification_focus_desc: "The strongest defense is the one that never breaks. We build and man the fortifications that will turn our borders into walls of steel."
 rpx_army_heavy_division_training: "Heavy Division Training"
 rpx_army_heavy_division_training_desc: "Our heavy divisions are the anvil of the army. We drill them relentlessly and keep their mighty vehicles in perfect condition."
 rpx_army_heavy_tank_focus: "Heavy Tank Focus"
 rpx_army_heavy_tank_focus_desc: "The heavy tank is a fortress on tracks. We invest in the armor and firepower that make our heavy tanks unstoppable."
 rpx_army_howitzer_focus: "Howitzer Focus"
 rpx_army_howitzer_focus_desc: "The howitzer hurls death at the enemy's positions. We develop ever more powerful artillery to support our armies."
 rpx_army_infantry_drill: "Infantry Drill"
 rpx_army_infantry_drill_desc: "The infantryman remains the queen of the battlefield. Constant drill makes our foot soldiers the equal of any enemy."
 rpx_army_light_tank_focus: "Light Tank Focus"
 rpx_army_light_tank_focus_desc: "Speed and mobility define the light tank. We develop fast, agile armored forces for reconnaissance and exploitation."
 rpx_army_manpower_organization: "Manpower Organization"
 rpx_army_manpower_organization_desc: "Manpower is the fuel of war. We reorganize our institutions to raise, train and equip more soldiers for the front."
 rpx_army_mass_mobilization: "Mass Mobilization"
 rpx_army_mass_mobilization_desc: "The nation rises as one. We mobilize our population to swell the ranks of the army with fresh divisions."
 rpx_army_master_training: "Master Training"
 rpx_army_master_training_desc: "Our training institutions are the best in the world. They turn out leaders and soldiers of unmatched quality."
 rpx_army_mechanized_warfare: "Mechanized Warfare"
 rpx_army_mechanized_warfare_desc: "The future of warfare is mechanized. We build the motorized and mechanized forces that will carry our armies across the continent."
 rpx_army_motorization_drive: "Motorization Drive"
 rpx_army_motorization_drive_desc: "Trucks are the sinews of the modern army. We motorize our divisions to move faster than the enemy can react."
 rpx_army_offensive_spirit: "Offensive Spirit"
 rpx_army_offensive_spirit_desc: "Attack! Our forces are imbued with the relentless offensive spirit that drives the enemy before us."
 rpx_army_officer_training: "Officer Training"
 rpx_army_officer_training_desc: "Good officers are worth their weight in gold. We expand our military academies to produce the leaders our army needs."
 rpx_army_premium_equipment: "Premium Equipment"
 rpx_army_premium_equipment_desc: "Only the best for our soldiers. We equip our troops with superior weapons that give them the edge in every engagement."
 rpx_army_rapid_mobilization: "Rapid Mobilization"
 rpx_army_rapid_mobilization_desc: "When war comes, we will be ready. We streamline mobilization to put trained divisions in the field with minimum delay."
 rpx_army_rocket_barrage: "Rocket Barrage"
 rpx_army_rocket_barrage_desc: "The rocket launcher delivers terrible firepower in moments. We mass rocket artillery to saturate enemy positions with steel and flame."
 rpx_army_rocket_focus: "Rocket Focus"
 rpx_army_rocket_focus_desc: "Rockets are the weapon of the future. We develop rocket artillery and rocket launchers to rain destruction on the enemy."
 rpx_army_rocket_mastery: "Rocket Mastery"
 rpx_army_rocket_mastery_desc: "We have perfected the art of the rocket. Our rocket artillery is the most feared in the world."
 rpx_army_self_propelled_artillery: "Self-Propelled Artillery"
 rpx_army_self_propelled_artillery_desc: "The gun that moves with the army is the gun that wins the battle. We mount our artillery on tracked chassis for mobility and firepower."
 rpx_army_special_forces_command: "Special Forces Command"
 rpx_army_special_forces_command_desc: "Our special forces are the sword of the state. We expand and command the elite units that strike where conventional forces cannot."
 rpx_army_steel_wall_doctrine: "Steel Wall Doctrine"
 rpx_army_steel_wall_doctrine_desc: "We shall not retreat. Our doctrine turns every position into a fortress and every soldier into a wall of steel."
 rpx_army_support_integration: "Support Integration"
 rpx_army_support_integration_desc: "Support companies multiply the power of our divisions. We integrate them thoroughly into every formation."
 rpx_army_synergy_training: "Synergy Training"
 rpx_army_synergy_training_desc: "Units that train together fight together. Joint training builds the mutual trust and understanding that win battles."
 rpx_army_tank_destroyer_focus: "Tank Destroyer Focus"
 rpx_army_tank_destroyer_focus_desc: "Every tank has a hunter. We develop the dedicated tank destroyers that stalk and kill enemy armor."
 rpx_army_tank_factory_network: "Tank Factory Network"
 rpx_army_tank_factory_network_desc: "Tanks are built in factories before they are built in battlefields. We expand the production network that keeps our armored forces rolling."
 rpx_army_total_conscription: "Total Conscription"
 rpx_army_total_conscription_desc: "The nation pours its last reserves into the war. Every able-bodied citizen is called to serve in the defense of the homeland."
 rpx_army_total_defense: "Total Defense"
 rpx_army_total_defense_desc: "We will defend our homeland to the last man. Every soldier, every position, every inch of soil is part of an unbreakable defense."
 rpx_army_total_offensive: "Total Offensive"
 rpx_army_total_offensive_desc: "There is no room for half-measures in the offensive. We commit everything to the attack, hurling our full strength against the enemy."
 rpx_army_total_war_machine: "Total War Machine"
 rpx_army_total_war_machine_desc: "The entire nation is a weapon of war. Our armed forces are the most powerful, best led and most highly motivated in the world."
 rpx_army_winter_warfare: "Winter Warfare"
 rpx_army_winter_warfare_desc: "The cold is a weapon we refuse to surrender. Our troops are trained and equipped to fight in the bitterest winter conditions."
 rpx_air_fuel_efficiency: "Air Fuel Efficiency"
 rpx_air_fuel_efficiency_desc: "Fuel is the lifeblood of modern air power. We refine our logistics to get more sorties from every drop of fuel."
 rpx_aircraft_output_1: "Aircraft Output I"
 rpx_aircraft_output_1_desc: "We streamline aircraft production to build more planes from the same resources."
 rpx_aircraft_output_2: "Aircraft Output II"
 rpx_aircraft_output_2_desc: "Our aircraft industry is refined to turn out ever larger numbers of machines."
 rpx_all_industry_speed: "All-Industry Speed"
 rpx_all_industry_speed_desc: "Every factory in the nation is modernized and expanded. Our entire industrial base produces faster than ever before."
 rpx_army_fuel_efficiency: "Army Fuel Efficiency"
 rpx_army_fuel_efficiency_desc: "An army moves on fuel as much as it moves on its feet. We improve the efficiency of our military logistics to stretch every barrel."
 rpx_civ_construction_speed: "Civilian Construction Speed"
 rpx_civ_construction_speed_desc: "We speed up the construction of civilian factories to power the growth of our economy."
 rpx_combined_output_1: "Combined Output I"
 rpx_combined_output_1_desc: "Both our civilian and naval industries are optimized for greater output."
 rpx_combined_output_2: "Combined Output II"
 rpx_combined_output_2_desc: "Our entire industrial apparatus, military and naval alike, produces at a dramatically increased rate."
 rpx_construction_speed_1: "Construction Speed I"
 rpx_construction_speed_1_desc: "We accelerate the pace of construction across the nation."
 rpx_construction_speed_2: "Construction Speed II"
 rpx_construction_speed_2_desc: "Improved techniques and organization speed up every building project."
 rpx_construction_speed_3: "Construction Speed III"
 rpx_construction_speed_3_desc: "Our construction industry operates at a truly remarkable pace."
 rpx_consumer_goods_1: "Consumer Goods I"
 rpx_consumer_goods_1_desc: "We trim the share of production devoted to consumer goods to free up industrial capacity."
 rpx_consumer_goods_2: "Consumer Goods II"
 rpx_consumer_goods_2_desc: "The needs of the state come before the comforts of the citizen. Consumer goods are further reduced."
 rpx_consumer_goods_3: "Consumer Goods III"
 rpx_consumer_goods_3_desc: "Sacrifice and rationing free more of our industry for the war effort."
 rpx_consumer_goods_4: "Consumer Goods IV"
 rpx_consumer_goods_4_desc: "The nation is mobilized to its utmost. Almost all production is devoted to the needs of war."
 rpx_conversion_cost_civ_to_mil: "Civilian to Military Conversion"
 rpx_conversion_cost_civ_to_mil_desc: "We can convert civilian factories to military production quickly and at reduced cost."
 rpx_conversion_cost_mil_to_civ: "Military to Civilian Conversion"
 rpx_conversion_cost_mil_to_civ_desc: "Military factories can be converted back to civilian production with minimal loss."
 rpx_dockyard_output_1: "Dockyard Output I"
 rpx_dockyard_output_1_desc: "Our dockyards produce more ships from the same resources."
 rpx_dockyard_output_2: "Dockyard Output II"
 rpx_dockyard_output_2_desc: "Shipbuilding is refined to squeeze ever more tonnage from our yards."
 rpx_dockyard_speed: "Dockyard Construction"
 rpx_dockyard_speed_desc: "We build new dockyards at an accelerated pace to expand our naval industry."
 rpx_economic_boom: "Economic Boom"
 rpx_economic_boom_desc: "The economy is booming. Production, construction and consumer confidence all surge in a golden age of growth."
 rpx_economic_crisis_1: "Economic Crisis I"
 rpx_economic_crisis_1_desc: "The economy has faltered. Unemployment and falling production sap the strength of the nation."
 rpx_economic_crisis_2: "Economic Crisis II"
 rpx_economic_crisis_2_desc: "A profound economic crisis grips the nation. Factories idle and resources lie unexploited."
 rpx_efficiency_gain_1: "Efficiency Gain I"
 rpx_efficiency_gain_1_desc: "Our factories learn faster, reaching full efficiency more quickly."
 rpx_efficiency_gain_2: "Efficiency Gain II"
 rpx_efficiency_gain_2_desc: "Industrial learning is accelerated, boosting production efficiency growth throughout the economy."
 rpx_factory_output_1: "Factory Output I"
 rpx_factory_output_1_desc: "Our military factories produce more from the same resources."
 rpx_factory_output_2: "Factory Output II"
 rpx_factory_output_2_desc: "Military production is refined for greater output from every factory."
 rpx_factory_output_3: "Factory Output III"
 rpx_factory_output_3_desc: "Our military industry is a model of efficiency, producing arms at an unmatched rate."
 rpx_fortification_speed: "Fortification Construction"
 rpx_fortification_speed_desc: "We build fortifications and coastal defenses faster, turning our borders into walls of concrete and steel."
 rpx_industrial_might: "Industrial Might"
 rpx_industrial_might_desc: "Our industry is the envy of the world. Factories and dockyards alike produce at maximum efficiency."
 rpx_infrastructure_focus: "Infrastructure Focus"
 rpx_infrastructure_focus_desc: "Roads, rails and supply lines are the sinews of the nation. We pour resources into our infrastructure network."
 rpx_infrastructure_speed: "Infrastructure Speed"
 rpx_infrastructure_speed_desc: "We accelerate the construction of the infrastructure that underpins our economy and our armies."
 rpx_local_resources_1: "Local Resources I"
 rpx_local_resources_1_desc: "We extract more resources from our own territory."
 rpx_local_resources_2: "Local Resources II"
 rpx_local_resources_2_desc: "Improved extraction techniques bring more local resources into production."
 rpx_local_resources_3: "Local Resources III"
 rpx_local_resources_3_desc: "Our mining and extraction industries are among the most productive in the world."
 rpx_max_efficiency_1: "Max Efficiency I"
 rpx_max_efficiency_1_desc: "Our factories can operate at a higher maximum efficiency."
 rpx_max_efficiency_2: "Max Efficiency II"
 rpx_max_efficiency_2_desc: "The ceiling on industrial efficiency is raised, allowing production to reach new heights."
 rpx_mil_construction_speed: "Military Construction Speed"
 rpx_mil_construction_speed_desc: "We build military factories at an accelerated pace."
 rpx_military_industrialization: "Military Industrialization"
 rpx_military_industrialization_desc: "The entire nation is being turned toward the production of arms. Our military industry expands at a tremendous rate."
 rpx_pp_gain: "Political Power Gain"
 rpx_pp_gain_desc: "Reformed institutions and effective leadership increase our political power."
 rpx_railway_speed: "Railway Construction"
 rpx_railway_speed_desc: "We expand and modernize our railway network, the backbone of military logistics."
 rpx_research_speed_1: "Research Speed I"
 rpx_research_speed_1_desc: "Our scientific institutions are better funded and organized."
 rpx_research_speed_2: "Research Speed II"
 rpx_research_speed_2_desc: "A dynamic scientific establishment accelerates our research across all fields."
 rpx_resource_efficiency: "Resource Efficiency"
 rpx_resource_efficiency_desc: "We use our resources more efficiently and extract more from our mines."
 rpx_resource_penalty_reduction: "Resource Penalty Reduction"
 rpx_resource_penalty_reduction_desc: "Our industry copes better with shortages of key resources."
 rpx_stability_bonus: "Stability Bonus"
 rpx_stability_bonus_desc: "The nation is calm and confident in its government."
 rpx_supply_consumption: "Reduced Supply Consumption"
 rpx_supply_consumption_desc: "Better logistics and organization reduce the supply demands of our forces."
 rpx_total_mobilization_spirit: "Total Mobilization Spirit"
 rpx_total_mobilization_spirit_desc: "The nation is mobilized for total war. Every factory, every worker and every resource serves the war effort."
 rpx_war_economy_spirit: "War Economy Spirit"
 rpx_war_economy_spirit_desc: "The economy is placed on a wartime footing. Production surges as the nation prepares for conflict."
 rpx_war_support_bonus: "War Support Bonus"
 rpx_war_support_bonus_desc: "The people stand behind their government's course."
 # =========================================================================
 # RPX NAVY IDEAS
 # =========================================================================
 rpx_navy_advanced_shipbuilding: "Advanced Shipbuilding"
 rpx_navy_advanced_shipbuilding_desc: "We adopt the most advanced shipbuilding techniques to reduce the cost of every vessel we lay down."
 rpx_navy_base_network: "Naval Base Network"
 rpx_navy_base_network_desc: "Our fleets need ports to rest, refit and resupply. We expand our network of naval bases across the seas."
 rpx_navy_battleship_armor: "Battleship Armor"
 rpx_navy_battleship_armor_desc: "The battleship is a fortress of the sea. We improve the armor and protection of our capital ships."
 rpx_navy_capital_ship_focus: "Capital Ship Focus"
 rpx_navy_capital_ship_focus_desc: "Battleships and battlecruisers are the pride of the fleet. We focus our naval program on these leviathans."
 rpx_navy_carrier_air_group: "Carrier Air Group"
 rpx_navy_carrier_air_group_desc: "The aircraft carrier has made the battleship obsolete. We expand the air groups that make our carriers so deadly."
 rpx_navy_carrier_operations: "Carrier Operations"
 rpx_navy_carrier_operations_desc: "We perfect the art of carrier warfare, launching and recovering aircraft with speed and precision."
 rpx_navy_carrier_pilot_training: "Carrier Pilot Training"
 rpx_navy_carrier_pilot_training_desc: "Landing on a carrier is the hardest feat in aviation. Our pilots train relentlessly to master it."
 rpx_navy_combined_arms: "Naval Combined Arms"
 rpx_navy_combined_arms_desc: "Carriers, capital ships, screens and submarines must work as one. Our naval doctrine binds them into a single fighting force."
 rpx_navy_convoy_protection: "Convoy Protection"
 rpx_navy_convoy_protection_desc: "Our lifelines must not be severed. We build and train the escort forces that protect our convoys from the raiders."
 rpx_navy_critical_hits: "Critical Hits"
 rpx_navy_critical_hits_desc: "A single well-placed shell can sink a battleship. We train our gunners to find and exploit the enemy's weakness."
 rpx_navy_cruiser_submarine: "Cruiser Submarine"
 rpx_navy_cruiser_submarine_desc: "The cruiser submarine combines the range of a cruiser with the stealth of a submarine. We develop these formidable raiders."
 rpx_navy_destroyer_escort: "Destroyer Escort"
 rpx_navy_destroyer_escort_desc: "The destroyer is the workhorse of the fleet. We improve our escorts to guard the fleet against every threat."
 rpx_navy_doctrine_research: "Naval Doctrine Research"
 rpx_navy_doctrine_research_desc: "Doctrine determines how we fight at sea. We fund research into the naval doctrines that will guide our fleet."
 rpx_navy_expeditionary_training: "Expeditionary Training"
 rpx_navy_expeditionary_training_desc: "Amphibious assault is the most complex operation in warfare. We train our forces to land on hostile shores."
 rpx_navy_fleet_submarine: "Fleet Submarine"
 rpx_navy_fleet_submarine_desc: "The fleet submarine ranges across the oceans to strike the enemy far from home. We develop these long-range hunters."
 rpx_navy_fuel_efficiency: "Naval Fuel Efficiency"
 rpx_navy_fuel_efficiency_desc: "Fuel is precious and fleets are thirsty. We improve the efficiency of our naval logistics."
 rpx_navy_heavy_guns: "Heavy Guns"
 rpx_navy_heavy_guns_desc: "The big gun is king at sea. We develop ever more powerful naval artillery for our capital ships."
 rpx_navy_intelligence: "Naval Intelligence"
 rpx_navy_intelligence_desc: "Knowing where the enemy is, is half the battle at sea. We strengthen our naval intelligence services."
 rpx_navy_light_cruiser_focus: "Light Cruiser Focus"
 rpx_navy_light_cruiser_focus_desc: "The light cruiser is the eyes and the blade of the fleet. We develop faster, more capable light cruisers."
 rpx_navy_mega_carrier: "Mega Carrier"
 rpx_navy_mega_carrier_desc: "Bigger carriers carry bigger air groups. We build carriers of unprecedented size and power."
 rpx_navy_midget_submarine: "Midget Submarine"
 rpx_navy_midget_submarine_desc: "Small submarines can slip where larger vessels cannot. We develop these stealthy raiders for special operations."
 rpx_navy_mine_warfare: "Mine Warfare"
 rpx_navy_mine_warfare_desc: "Mines are the silent sentinels of the sea. We perfect the laying and use of naval mines."
 rpx_navy_morale: "Naval Morale"
 rpx_navy_morale_desc: "A navy that believes in itself cannot be beaten. We sustain the morale of our sailors through the longest campaigns."
 rpx_navy_naval_bomber_production: "Naval Bomber Production"
 rpx_navy_naval_bomber_production_desc: "The naval bomber is the bane of the battleship. We mass-produce the aircraft that strike the enemy fleet."
 rpx_navy_officer_corps: "Naval Officer Corps"
 rpx_navy_officer_corps_desc: "A professional officer corps commands an effective fleet. We expand and train our naval leadership."
 rpx_navy_projection: "Naval Projection"
 rpx_navy_projection_desc: "The reach of our fleet is the reach of our power. We build the range and endurance that project our navy across the world."
 rpx_navy_screen_warfare: "Screen Warfare"
 rpx_navy_screen_warfare_desc: "Screens protect the fleet from torpedo and submarine. We train our destroyers and cruisers to screen the battle line."
 rpx_navy_ship_speed_program: "Ship Speed Program"
 rpx_navy_ship_speed_program_desc: "Speed is life at sea. We develop faster hulls and more powerful engines for our warships."
 rpx_navy_shipbuilding_network: "Shipbuilding Network"
 rpx_navy_shipbuilding_network_desc: "We build the network of dockyards and suppliers that lets our fleet grow faster than the enemy's."
 rpx_navy_submarine_fleet: "Submarine Fleet"
 rpx_navy_submarine_fleet_desc: "The submarine is the weapon of the weak against the strong. We build a fleet of undersea raiders to strangle enemy shipping."
 rpx_navy_submarine_hunter_killer: "Submarine Hunter-Killer"
 rpx_navy_submarine_hunter_killer_desc: "The only defense against the submarine is the submarine hunter. We develop the tactics and ships to hunt the hunters."
 rpx_navy_submarine_stealth: "Submarine Stealth"
 rpx_navy_submarine_stealth_desc: "The submarine's strength is its invisibility. We refine the stealth that lets our boats strike and vanish."
 rpx_navy_super_heavy_artillery: "Super-Heavy Artillery"
 rpx_navy_super_heavy_artillery_desc: "The mightiest guns ever mounted at sea. We develop super-heavy artillery to destroy any ship afloat."
 rpx_navy_torpedo_cruiser: "Torpedo Cruiser"
 rpx_navy_torpedo_cruiser_desc: "The torpedo cruiser combines the speed of a cruiser with the sting of the torpedo. We develop these deadly raiders."
 rpx_navy_torpedo_expertise: "Torpedo Expertise"
 rpx_navy_torpedo_expertise_desc: "The torpedo is the great equalizer of the seas. We perfect the art of the torpedo attack."
 rpx_pol_advisor_cost: "Reduced Advisor Costs"
 rpx_pol_advisor_cost_desc: "A reformed administration spends less on political advisors, freeing political power for other purposes."
 rpx_pol_agency_defense: "Intelligence Agency Defense"
 rpx_pol_agency_defense_desc: "Our intelligence agencies are hardened against enemy operations, protecting our secrets and our operatives."
 rpx_pol_army_intel: "Army Intelligence"
 rpx_pol_army_intel_desc: "Our intelligence services provide the army with accurate and timely information on the enemy."
 rpx_pol_autonomy_gain: "Autonomy Gain"
 rpx_pol_autonomy_gain_desc: "We tighten our grip on our subjects, increasing the flow of resources from them to us."
 rpx_pol_communism_drift: "Communist Support"
 rpx_pol_communism_drift_desc: "We encourage the growth of the communist movement within our country."
 rpx_pol_compliance_gain: "Compliance Gain"
 rpx_pol_compliance_gain_desc: "Wise governance and effective administration raise the compliance of the populations we occupy."
 rpx_pol_conscription_1: "Conscription Expansion I"
 rpx_pol_conscription_1_desc: "We expand the pool of manpower available to the armed forces."
 rpx_pol_conscription_2: "Conscription Expansion II"
 rpx_pol_conscription_2_desc: "The conscription laws are tightened further, bringing more of the population into the army."
 rpx_pol_defensive_war: "Defensive War Stability"
 rpx_pol_defensive_war_desc: "The nation stands firm when its homeland is threatened. Defensive wars are fought with unwavering stability."
 rpx_pol_democratic_drift: "Democratic Support"
 rpx_pol_democratic_drift_desc: "We encourage the growth of democratic institutions and values within our country."
 rpx_pol_drift_defence: "Ideological Drift Defence"
 rpx_pol_drift_defence_desc: "Our institutions are immune to the siren song of foreign ideologies."
 rpx_pol_exile_manpower: "Exile Manpower"
 rpx_pol_exile_manpower_desc: "Our exiled patriots flock to the cause, swelling the ranks of our armed forces abroad."
 rpx_pol_fascism_drift: "Fascist Support"
 rpx_pol_fascism_drift_desc: "We encourage the growth of the fascist movement within our country."
 rpx_pol_foreign_intel: "Foreign Intelligence"
 rpx_pol_foreign_intel_desc: "Our intelligence services excel at capturing enemy operatives on our soil."
 rpx_pol_ideology_acceptance: "Ideological Acceptance"
 rpx_pol_ideology_acceptance_desc: "We are open to cooperation with nations of every ideology, improving our relations across the world."
 rpx_pol_ideology_boost: "Ideology Boost"
 rpx_pol_ideology_boost_desc: "Our agents are masters of boosting friendly ideologies in foreign nations."
 rpx_pol_intel_network: "Intelligence Network"
 rpx_pol_intel_network_desc: "Our intelligence network grows stronger, gathering more intelligence on our enemies."
 rpx_pol_legitimacy: "Legitimacy"
 rpx_pol_legitimacy_desc: "Our government commands respect at home and abroad. Legitimacy grows steadily."
 rpx_pol_master_of_statecraft: "Master of Statecraft"
 rpx_pol_master_of_statecraft_desc: "Our leadership is the finest in the world, wielding political power, stability and popular support with unmatched skill."
 rpx_pol_neutrality_drift: "Neutrality Support"
 rpx_pol_neutrality_drift_desc: "We encourage the growth of the neutralist movement within our country."
 rpx_pol_non_core_manpower: "Non-Core Manpower"
 rpx_pol_non_core_manpower_desc: "We recruit manpower from the territories we occupy, adding their strength to our armies."
 rpx_pol_offensive_war: "Offensive War Stability"
 rpx_pol_offensive_war_desc: "The nation is united behind aggressive foreign policy. Offensive wars are fought with unwavering stability."
 rpx_pol_party_popularity: "Party Popularity"
 rpx_pol_party_popularity_desc: "Our ruling party enjoys broad support, stabilizing the nation."
 rpx_pol_pp_cost: "Reduced Political Power Costs"
 rpx_pol_pp_cost_desc: "An efficient administration reduces the political power cost of government actions."
 rpx_pol_pp_gain_1: "Political Power Gain I"
 rpx_pol_pp_gain_1_desc: "Reformed institutions increase our political power."
 rpx_pol_pp_gain_2: "Political Power Gain II"
 rpx_pol_pp_gain_2_desc: "Our political power grows at a dramatically increased rate."
 rpx_pol_puppet_cost: "Puppet Cost Reduction"
 rpx_pol_puppet_cost_desc: "Establishing puppets is cheaper and easier for our government."
 rpx_pol_resistance_decay: "Resistance Decay"
 rpx_pol_resistance_decay_desc: "Our occupation policies weaken resistance in the territories we control."
 rpx_pol_resistance_target: "Resistance Target"
 rpx_pol_resistance_target_desc: "Harsh but effective occupation policies lower the resistance target of our occupied territories."
 rpx_pol_root_out_resistance: "Root Out Resistance"
 rpx_pol_root_out_resistance_desc: "Our security services are relentless in rooting out resistance in occupied territory."
 rpx_pol_same_ideology_opinion: "Same Ideology Relations"
 rpx_pol_same_ideology_opinion_desc: "Our diplomacy builds stronger bonds with nations that share our ideology."
 rpx_pol_stability_1: "Stability I"
 rpx_pol_stability_1_desc: "Careful governance raises the stability of the nation."
 rpx_pol_stability_2: "Stability II"
 rpx_pol_stability_2_desc: "The nation is more stable than ever, united behind its government."
 rpx_pol_stability_weekly: "Weekly Stability"
 rpx_pol_stability_weekly_desc: "Steady governance builds stability day by day, week by week."
 rpx_pol_starting_compliance: "Starting Compliance"
 rpx_pol_starting_compliance_desc: "The territories we occupy start with a higher baseline of compliance."
 rpx_pol_subjects_autonomy: "Subject Autonomy"
 rpx_pol_subjects_autonomy_desc: "Our subjects are kept tightly under our control, their autonomy growing slowly."
 rpx_pol_total_mobilization: "Total Mobilization"
 rpx_pol_total_mobilization_desc: "The entire nation is mobilized for war. Conscription, war support and political power all surge."
 rpx_pol_unquestioned_authority: "Unquestioned Authority"
 rpx_pol_unquestioned_authority_desc: "The leader's word is law. Our authority is absolute, stable and beyond challenge."
 rpx_pol_war_stability: "War Stability"
 rpx_pol_war_stability_desc: "The nation endures the trials of war without wavering."
 rpx_pol_war_support_1: "War Support I"
 rpx_pol_war_support_1_desc: "The people support the war effort."
 rpx_pol_war_support_2: "War Support II"
 rpx_pol_war_support_2_desc: "Popular support for the war reaches new heights."
 rpx_pol_war_support_weekly: "Weekly War Support"
 rpx_pol_war_support_weekly_desc: "Steady propaganda and leadership build war support day by day."
 rpx_pol_weekly_manpower: "Weekly Manpower"
 rpx_pol_weekly_manpower_desc: "Manpower flows steadily into the ranks of our armed forces."
