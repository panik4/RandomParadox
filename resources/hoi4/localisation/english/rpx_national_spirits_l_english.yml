 rpx_dev_agricultural: "Agricultural Society"
 rpx_dev_agricultural_desc: "Our nation's lifeblood flows from the land. Fields and farms feed us, but the factories that would arm us remain few."
 rpx_dev_developing: "Developing Country"
 rpx_dev_developing_desc: "We are building our nation from modest beginnings. Much of our effort still goes toward keeping society running, leaving little for grand projects."
 rpx_dev_emerging: "Emerging Industrializer"
 rpx_dev_emerging_desc: "Smokestacks rise across our countryside. Our industry is young and full of promise, though our scientists still trail the world's leaders."
 rpx_dev_industrialized: "Industrialized Nation"
 rpx_dev_industrialized_desc: "Our mills and workshops hum with steady purpose. A solid industrial base supports our ambitions."
 rpx_dev_industrial_giant: "Industrial Giant"
 rpx_dev_industrial_giant_desc: "Our forges are the envy of the world. Few nations can match the sheer scale of our production."
 rpx_economic_crisis: "Economic crisis"
 rpx_economic_crisis_desc: "Our economy is doing terrible"
 rpx_economic_downturn: "Economic crisis"
 rpx_economic_downturn_desc: "Our economy is not doing badly"
 rpx_economic_upturn: "Economic upturn"
 rpx_economic_upturn_desc: "Our economy is doing well"
 rpx_economic_boom_spirit: "Economic boom"
 rpx_economic_boom_spirit_desc: "Our economy is doing great!"
 rpx_char_admin_bureaucratic: "Bureaucratic"
 rpx_char_admin_bureaucratic_desc: "Our state runs on paper, procedure, and patience. Nothing is decided quickly, but nothing is decided twice."
 rpx_char_admin_corrupt: "Corrupt"
 rpx_char_admin_corrupt_desc: "Graft runs through our halls of power. Favours are bought, offices sold, and the state's reach is measured in bribes."
 rpx_char_admin_lawless: "Lawless"
 rpx_char_admin_lawless_desc: "The writ of our state does not reach far. Banditry and feuds flourish where the law fears to tread."
 rpx_char_admin_lawful: "Lawful"
 rpx_char_admin_lawful_desc: "The rule of law is our foundation. Contracts are honoured, disputes settled, and order maintained by a trusted state."
 rpx_char_admin_inefficient: "Inefficient"
 rpx_char_admin_inefficient_desc: "Our administration wastes time, money, and effort. Simple tasks take weeks and every decision is a committee."
 rpx_char_admin_efficient: "Efficient"
 rpx_char_admin_efficient_desc: "Our state machine is well-oiled. Papers move fast, plans are kept lean, and the administration gets things done."
 rpx_char_admin_ingenious: "Ingenious"
 rpx_char_admin_ingenious_desc: "Our administrators and engineers are gifted problem solvers, finding clever solutions where others see dead ends."
 rpx_char_admin_innovative: "Innovative"
 rpx_char_admin_innovative_desc: "We embrace the new. Research, industry, and governance all benefit from our openness to change."
 rpx_char_admin_underfunded: "Underfunded"
 rpx_char_admin_underfunded_desc: "Our institutions are starved of money and men and women. Administrators make do with too little, and it shows."
 rpx_char_nav_maritime: "Maritime Tradition"
 rpx_char_nav_maritime_desc: "The sea is in our blood. Our people are born to the water, and the navy is an old and honoured calling."
 rpx_char_nav_fleet_in_being: "Fleet-in-Being Tradition"
 rpx_char_nav_fleet_in_being_desc: "Our navy exists to deter, not to be spent. Ships are preserved, crews are kept sharp, and the threat of our fleet hangs over the enemy."
 rpx_char_nav_coastal_defense: "Coastal Defense Tradition"
 rpx_char_nav_coastal_defense_desc: "We defend our shores and harbour approaches with skill and stubbornness. Invaders learn to fear our coastlines."
 rpx_char_nav_commerce_raider: "Commerce Raider Tradition"
 rpx_char_nav_commerce_raider_desc: "We wage war on the enemy's trade. Our raiders stalk the sea lanes, and every convoy must run the gauntlet."
 rpx_char_nav_capital_ship: "Capital Ship Tradition"
 rpx_char_nav_capital_ship_desc: "Our pride sails in big-gunned ships. Battleships are the backbone of our fleet, and their guns speak for the nation."
 rpx_char_nav_submarine: "Submarine Tradition"
 rpx_char_nav_submarine_desc: "Silent service, deadly intent. Our submarines slip beneath the waves to strike where the enemy least expects."
 rpx_char_nav_amphibious: "Amphibious Warfare Tradition"
 rpx_char_nav_amphibious_desc: "We put men ashore where they are least expected. Our marines and landing craft are honed for the hardest job in war."
 rpx_char_nav_overseas_fleet: "Overseas Fleet Tradition"
 rpx_char_nav_overseas_fleet_desc: "Our flag follows the trade winds. A blue-water navy projects our power across the oceans and guards far-flung interests."
 rpx_char_nav_naval_gunnery: "Naval Gunnery Tradition"
 rpx_char_nav_naval_gunnery_desc: "Our gunners are the envy of other navies. Shot after shot finds its mark, from broadsides to anti-air fire."
 rpx_char_nav_naval_academy: "Naval Academy Tradition"
 rpx_char_nav_naval_academy_desc: "Our naval academies turn out officers of rare quality. Midshipmen become admirals, and the fleet is led by learned hands."
 rpx_char_air_aviation: "Aviation Tradition"
 rpx_char_air_aviation_desc: "The skies are part of who we are. Flying is a national calling, and our airmen are among the most accomplished in the world."
 rpx_char_air_fighter: "Fighter Tradition"
 rpx_char_air_fighter_desc: "Command of the skies falls to the fighters. Our pursuit squadrons are deadly in the air, and enemy bombers learn to fear them."
 rpx_char_air_close_air_support: "Close Air Support Tradition"
 rpx_char_air_close_air_support_desc: "Our dive-bombers and assault aircraft are a hammer at the army's call. Ground troops advance under a roof of friendly steel."
 rpx_char_air_tactical_air_force: "Tactical Air Force Tradition"
 rpx_char_air_tactical_air_force_desc: "Our medium bombers strike deep behind the lines, cutting supply and breaking railheads. The army fights with the air force in step."
 rpx_char_air_naval_aviation: "Naval Aviation Tradition"
 rpx_char_air_naval_aviation_desc: "The flight deck is our airfield. Our carrier air groups strike far from home, carrying the fleet's power into enemy waters."
 rpx_char_air_defense: "Air Defense Tradition"
 rpx_char_air_defense_desc: "The homeland is ringed with guns, searchlights and radar. Raiders over our cities pay a terrible price for their temerity."
 rpx_char_air_independent_air_force: "Independent Air Force"
 rpx_char_air_independent_air_force_desc: "Our air force is a service in its own right, free from the army and navy. Strategic thought in the air runs deep and unhindered."
 rpx_char_air_army_air_corps: "Army Air Corps Tradition"
 rpx_char_air_army_air_corps_desc: "The air arm serves the soldier. Airpower is woven into the army's fabric, flying artillery that moves with the front."
 rpx_char_mil_professional_army: "Professional Army"
 rpx_char_mil_professional_army_desc: "Our soldiers are regulars, drilled and disciplined. They fight with a professionalism that part-time armies cannot match."
 rpx_char_mil_officer_corps: "Officer Corps Tradition"
 rpx_char_mil_officer_corps_desc: "A proud tradition of command runs through our academies. Our officers are taught, mentored, and held to a high standard."
 rpx_char_mil_militia: "Militia Tradition"
 rpx_char_mil_militia_desc: "When danger calls, our people answer. Citizens drill in peacetime and take up arms in defence of the homeland."
 rpx_char_mil_cavalry: "Cavalry Tradition"
 rpx_char_mil_cavalry_desc: "We are a nation of horsemen. Mobility and dash are in our blood, and our cavalry carries the old ways into the new age."
 rpx_char_mil_artillery: "Artillery Tradition"
 rpx_char_mil_artillery_desc: "The cannon is king in our armies. Our gunners are masters of fire support, and the shells do much of the talking."
 rpx_char_mil_mountain: "Mountain Warfare Tradition"
 rpx_char_mil_mountain_desc: "Our soldiers are bred in the high country. They climb where others falter and fight where the peaks decide the battle."
 rpx_char_mil_mechanized: "Mechanized Warfare Tradition"
 rpx_char_mil_mechanized_desc: "We fight with engines and steel. Armoured columns, motorized infantry, and overwhelming breakthrough are the heart of our doctrine."
 rpx_char_mil_politicized: "Politicized Military"
 rpx_char_mil_politicized_desc: "The army answers to the party, not the state. Loyalty to the cause outweighs professional skill, and politics reach into the ranks."
 rpx_char_mil_civilian_tradition: "Civilian Military Tradition"
 rpx_char_mil_civilian_tradition_desc: "The uniform serves the civilian state. The army is respected but restrained, funded by the taxpayer and watched by parliament."
 rpx_char_mil_industrial_complex: "Military-Industrial Complex"
 rpx_char_mil_industrial_complex_desc: "Arms makers and generals alike feed on the state's appetite for war. Defence spending is enormous, and so is their influence."
 rpx_char_colonial_empire: "Colonial Empire"
 rpx_char_colonial_empire_desc: "Our flag flies over distant lands, and their manpower and riches flow to the metropole. But holding it all together weighs on us."
 rpx_char_decaying_colonial: "Decaying Colonial Empire"
 rpx_char_decaying_colonial_desc: "An empire past its prime. Our grip on distant possessions loosens while unrest festers at home and abroad."
 rpx_char_great_power: "Great Power"
 rpx_char_great_power_desc: "The world listens when we speak. Our word carries weight on the international stage."
 rpx_char_regional_power: "Regional Power"
 rpx_char_regional_power_desc: "Within our corner of the world, we are a force to be reckoned with and a voice others heed."
 rpx_char_isolationist: "Isolationist"
 rpx_char_isolationist_desc: "We keep to ourselves, looking inward. The quarrels of the wider world are not our concern."
 rpx_char_island_nation: "Island Nation"
 rpx_char_island_nation_desc: "The sea is both our shield and our road. We are lean, self-reliant, and ever watchful of the horizon."
 rpx_char_landlocked: "Landlocked Nation"
 rpx_char_landlocked_desc: "Without a coast, our armies and roads bear the weight of our destiny. We look to the land for our strength."
 rpx_char_resource_rich: "Resource-Rich"
 rpx_char_resource_rich_desc: "Beneath our soil lie treasures the world hungers for. Our wealth is measured in ore and oil."
 rpx_char_import_dependent: "Import-Dependent"
 rpx_char_import_dependent_desc: "We lack the resources our factories demand. Our prosperity rests on trade that can be cut at any time."
 rpx_char_multiethnic: "Multiethnic Federation"
 rpx_char_multiethnic_desc: "Many peoples call our nation home. Their numbers are our strength, though keeping them together is no easy task."
 rpx_char_militarized: "Militarized Society"
 rpx_char_militarized_desc: "Our nation is built for war. Service is a way of life, and the army stands at the heart of our society."
 rpx_char_neutral_tradition: "Neutral Tradition"
 rpx_char_neutral_tradition_desc: "We have long kept out of the quarrels of great powers. Our neutrality is a point of pride."
 rpx_char_revolutionary: "Revolutionary State"
 rpx_char_revolutionary_desc: "We are the vanguard of a new order. The fervour of our cause drives every aspect of national life."
 rpx_char_young_nation: "Young Nation"
 rpx_char_young_nation_desc: "We are young and full of energy, still forging our identity. Our people are eager, even if our institutions are not."
 rpx_char_aging_society: "Aging Society"
 rpx_char_aging_society_desc: "Our people are older, wiser, and fewer. Experience abounds, but the young men who fill the ranks grow scarce."